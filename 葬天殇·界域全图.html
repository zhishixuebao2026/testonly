<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>葬天殇 · 界域全图</title>
<style>
:root{
 --paper:#0A0706; --paper2:#14100F;
 --line:#3A2F26; --line2:#5E4F41; --lineDim:#2A231F;
 --silk:#D3C4A6; --silk2:#9E8F79; --silk3:#6B5D4E; --moon:#EFE7D6;
 --cin:#AE3A2B; --cin2:#D06A55; --cinDim:#4A2019; --cinSilk:#DCB39F;
 --gold:#B4913F; --goldDim:#5E4A22; --goldSilk:#E0C784;
 --jade:#3A8C7D; --jade2:#5AB8A6; --jadeDim:#1C4A3F;
 --violet:#584655; --violet2:#8A7A8C;
 --song:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
 --kai:"Kaiti SC","STKaiti","KaiTi","Source Han Serif SC",serif;
 --ease:cubic-bezier(.22,.61,.36,1);
 --glow: 0 0 20px rgba(180,145,63,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--silk);font-family:var(--song);font-size:14px;
 -webkit-font-smoothing:antialiased;overscroll-behavior:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#stage{position:fixed;inset:0;cursor:grab;touch-action:none;overflow:hidden;background:#0E0B0A;transition:background .5s linear}
#stage.grab{cursor:grabbing}
#world{position:absolute;inset:0;contain:strict}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;cursor:pointer;will-change:transform,opacity}
.layer svg{display:block;overflow:visible}
.layer .nm,.layer .dt,.layer .fine,.layer .fine2,.layer .fine3{opacity:0;transition:opacity .3s linear}
#grain{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.2;mix-blend-mode:soft-light;
 background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}



/* 书脊 - 增强质感 */
.spine{position:fixed;left:0;top:0;bottom:0;width:56px;z-index:20;display:flex;flex-direction:column;
 align-items:center;justify-content:space-between;padding:22px 0 18px;pointer-events:none;
 background:linear-gradient(90deg,rgba(10,7,6,.96),rgba(10,7,6,.35));border-right:1px solid var(--lineDim);
 box-shadow: 2px 0 8px rgba(0,0,0,0.4);}
.seal{width:26px;height:26px;border:1.5px solid var(--cin);display:flex;align-items:center;justify-content:center;flex:none;
 background:rgba(174,58,43,0.1);border-radius:2px;}
.seal span{font-size:13px;color:var(--cin2);font-weight:600;line-height:1;text-shadow:0 0 4px rgba(208,106,85,0.5);}
.spine__t{writing-mode:vertical-rl;font-size:24px;letter-spacing:.44em;font-weight:600;text-indent:.44em;color:var(--silk)}
.spine__t em{font-style:normal;color:var(--cin2)}
.spine__f{writing-mode:vertical-rl;font-size:11px;letter-spacing:.32em;color:var(--silk3)}

/* 卷题 - 增强视觉效果 */
.hud{position:fixed;left:78px;top:24px;z-index:20;pointer-events:none;max-width:min(46vw,520px)}
.hud__z{font-size:12.5px;letter-spacing:.3em;color:var(--silk3);margin-bottom:7px;opacity:0.8;}
.hud__n{font-size:clamp(28px,3.8vw,44px);font-weight:600;letter-spacing:.2em;color:var(--moon);
 line-height:1.1;text-shadow:0 2px 22px rgba(16,13,12,.96), 0 0 10px rgba(239,231,214,0.3);}
.hud__a{font-size:13px;color:var(--silk2);letter-spacing:.14em;margin-top:8px;
 text-shadow:0 1px 12px rgba(16,13,12,.98);font-family:var(--kai)}

/* 卷宗 - 增强质感 */
.book{position:fixed;right:0;top:0;bottom:0;width:min(392px,88vw);z-index:22;
 background:linear-gradient(270deg,rgba(20,16,15,.985),rgba(10,7,6,.94));
 border-left:1px solid var(--line);display:flex;flex-direction:column;
 transform:translateX(100%);transition:transform .5s var(--ease);
 -webkit-user-select:text;user-select:text;box-shadow:-2px 0 12px rgba(0,0,0,0.5);}
.book.open{transform:translateX(0)}
.book__tabs{display:flex;border-bottom:1px solid var(--line);flex:none;background:rgba(20,16,15,0.9);}
.btab{flex:1;background:none;border:none;border-right:1px solid var(--lineDim);color:var(--silk3);
 font-family:var(--song);font-size:14.5px;letter-spacing:.26em;font-weight:600;padding:16px 0 15px;cursor:pointer;transition:.26s;
 background:linear-gradient(to bottom, rgba(20,16,15,0.9), rgba(14,11,10,0.9));}
.btab:last-child{border-right:none}
.btab:hover{color:var(--silk);background:linear-gradient(to bottom, rgba(30,26,25,0.9), rgba(24,20,19,0.9));}
.btab[aria-selected="true"]{color:var(--moon);background:rgba(110,95,81,.13);
 box-shadow:inset 0 -2px 0 var(--cin);}
.btab[aria-selected="true"]::after{content:"";display:block;height:2px;background:var(--cin);margin:15px -1px -17px;
 box-shadow:0 0 8px rgba(208,106,85,0.5);}
.book__body{flex:1;overflow-y:auto;overscroll-behavior:contain;background:rgba(14,11,10,0.95);}
.book__body::-webkit-scrollbar{width:5px}
.book__body::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
.bpane{display:none;padding:24px 26px 46px;background:rgba(14,11,10,0.98);}
.bpane.on{display:block}
.tabhandle{position:fixed;top:50%;right:0;z-index:23;transform:translateY(-50%);width:30px;padding:16px 0;
 background:var(--paper2);border:1px solid var(--line);border-right:none;color:var(--silk2);cursor:pointer;
 font-family:var(--song);font-size:13px;letter-spacing:.28em;writing-mode:vertical-rl;text-indent:.28em;
 transition:right .5s var(--ease),color .26s;box-shadow:-1px 0 4px rgba(0,0,0,0.3);}
.tabhandle:hover{color:var(--moon);background:rgba(30,26,25,0.9);}
.book.open ~ .tabhandle{right:min(392px,88vw)}

.p__k{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.22em;color:var(--silk3)}
.p__k em{font-style:normal;color:var(--line2)}
.p__n{font-size:33px;font-weight:600;letter-spacing:.18em;color:var(--moon);margin:10px 0 3px}
.p__a{font-size:12.5px;color:var(--silk3);letter-spacing:.14em;margin-bottom:17px;font-family:var(--kai)}
.p__d{font-size:13.5px;line-height:2.05;color:var(--silk2);margin-bottom:18px;text-align:justify}
.p__d strong{color:var(--silk);font-weight:600}
dl.facts{border-top:1px solid var(--lineDim);margin-bottom:17px}
.fact{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--lineDim);align-items:baseline}
.fact dt{font-size:12px;letter-spacing:.24em;color:var(--silk3);width:46px;flex:none;font-family:var(--kai)}
.fact dd{font-size:13px;color:var(--silk);line-height:1.85;flex:1}
.fact--g dd{color:var(--goldSilk)}
ul.lmk{list-style:none;margin-bottom:18px}
.subs{display:flex;flex-wrap:wrap;gap:7px}
.subs__h{width:100%;font-size:12px;letter-spacing:.24em;color:var(--silk3);margin-bottom:9px;font-family:var(--kai)}
.chip{background:none;border:1px solid var(--line);color:var(--silk2);font-family:var(--song);font-size:13px;
 letter-spacing:.12em;font-weight:600;padding:6px 14px;cursor:pointer;transition:.24s}
.chip:hover{border-color:var(--silk2);color:var(--moon);background:rgba(110,95,81,.1)}
.chip--u{border-style:dashed;color:var(--silk3)}
.lmk__h{font-size:12px;letter-spacing:.24em;color:var(--silk3);margin-bottom:9px;font-family:var(--kai)}
.lmk li{display:flex;gap:9px;font-size:12.5px;color:var(--silk2);padding:5px 0;line-height:1.75}
.lmk li b{color:var(--silk);font-weight:600;letter-spacing:.1em;flex:none}
.lmk li::before{content:"·";color:var(--cin);font-size:16px;line-height:1.2;flex:none}

.tier{margin-bottom:26px}
.tier h3{font-size:17px;letter-spacing:.3em;font-weight:600;color:var(--silk);padding-bottom:9px;border-bottom:1px solid var(--line)}
.tier p.tn{font-size:12px;color:var(--silk3);line-height:1.9;margin:10px 0 12px;font-family:var(--kai)}
.step{width:100%;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:baseline;background:none;
 border:none;border-bottom:1px solid var(--lineDim);padding:10px 0;cursor:pointer;text-align:left;color:inherit}
.step:hover{background:rgba(110,95,81,.07)}
.step__n{font-size:12px;color:var(--silk3);font-family:var(--kai)}
.step[aria-expanded="true"] .step__n{color:var(--cin2)}
.step__m{font-size:16px;letter-spacing:.2em;font-weight:600;color:var(--silk)}
.step__m small{font-size:11.5px;letter-spacing:.08em;color:var(--silk3);margin-left:10px;font-weight:400}
.step__g{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--silk3);margin-top:4px;font-family:var(--kai)}
.sbody{display:none;font-size:12.5px;line-height:2;color:var(--silk2);padding:5px 0 15px 42px;text-align:justify}
.sbody.on{display:block}
.sbody .nt{display:block;margin-top:9px;font-size:12px;color:var(--goldSilk);border-left:2px solid var(--goldDim);padding-left:10px;font-family:var(--kai)}
.tier--i .step__m{color:#DED0B4}
.tier--b .step__m{color:var(--goldSilk)} .tier--b .step__n{color:var(--goldDim)}
.tier--s .step__m{color:var(--moon);text-shadow:0 0 18px rgba(239,231,214,.32)}

.card{border:1px solid var(--lineDim);padding:17px 18px;margin-bottom:11px;background:rgba(34,28,25,.5)}
.card__n{font-size:12px;letter-spacing:.2em;color:var(--silk3);margin-bottom:8px;font-family:var(--kai)}
.card h4{font-size:16px;letter-spacing:.18em;font-weight:600;color:var(--silk);margin-bottom:8px}
.card p{font-size:12.5px;line-height:2;color:var(--silk2);text-align:justify}
.card--b{border-left:2px solid var(--cinDim)} .card--b h4{color:var(--cinSilk)}
.sh{font-size:13px;letter-spacing:.3em;color:var(--silk3);margin:6px 0 16px;font-family:var(--kai)}
.sh.mt{margin-top:34px}
.ev{position:relative;padding:0 0 22px 28px;border-left:1px solid var(--lineDim);margin-left:5px}
.ev:last-child{border-left-color:transparent}
.ev__d{position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.ev--g .ev__d{background:var(--gold)} .ev--b .ev__d{background:var(--cin)}
.ev__n{font-size:12px;letter-spacing:.2em;color:var(--silk3);font-family:var(--kai)}
.ev h4{font-size:16px;letter-spacing:.18em;font-weight:600;color:var(--silk);margin:4px 0 7px}
.ev--g h4{color:var(--goldSilk)} .ev--b h4{color:var(--cinSilk)}
.ev p{font-size:12.5px;line-height:1.95;color:var(--silk2);text-align:justify}
.ev__w{display:inline-block;margin-top:8px;font-size:11.5px;letter-spacing:.16em;color:var(--silk3);
 border:1px solid var(--lineDim);padding:3px 10px;font-family:var(--kai)}

/* 区域索引条 */
.rail{position:fixed;left:78px;bottom:26px;z-index:20;display:flex;align-items:flex-end;
 max-width:calc(100vw - 220px);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rail::-webkit-scrollbar{display:none}
.rnode{background:none;border:none;cursor:pointer;padding:0;color:var(--silk3);flex:none;width:30px;
 display:flex;flex-direction:column;align-items:center;gap:9px;transition:color .26s}
.rnode:hover{color:var(--silk)}
.rnode__d{width:5px;height:5px;border-radius:50%;background:var(--lineDim);flex:none;transition:.3s}
.rnode__t{writing-mode:vertical-rl;font-size:12px;letter-spacing:.1em;font-weight:600;white-space:nowrap;height:70px;text-align:right}
.rnode.on{color:var(--moon)}
.rnode.on .rnode__d{background:var(--cin2);box-shadow:0 0 10px rgba(208,106,85,.7);width:7px;height:7px}

.ctl{position:fixed;bottom:26px;right:26px;z-index:21;display:flex;flex-direction:column;gap:8px}
.cbtn{width:40px;height:40px;background:rgba(26,22,20,.94);border:1px solid var(--line);color:var(--silk2);
 font-family:var(--song);font-size:16px;font-weight:600;cursor:pointer;transition:.24s;
 display:flex;align-items:center;justify-content:center}
.cbtn:hover{border-color:var(--silk2);color:var(--moon)}
.cbtn.tal{height:66px;border-color:var(--goldDim);color:var(--gold);font-size:13px;letter-spacing:.14em;
 writing-mode:vertical-rl;text-indent:.14em}
.cbtn.tal:hover{border-color:var(--gold);color:var(--goldSilk);box-shadow:0 0 22px rgba(180,145,63,.22)}

.tip{position:fixed;left:50%;bottom:126px;transform:translateX(-50%);z-index:24;text-align:center;
 pointer-events:none;transition:opacity 1s var(--ease)}
.tip.gone{opacity:0}
.tip b{display:block;font-size:15px;letter-spacing:.34em;color:var(--silk);font-weight:600;margin-bottom:10px}
.tip span{font-size:12.5px;letter-spacing:.22em;color:var(--silk3);font-family:var(--kai)}

@media (max-width:900px){
 .book{width:100vw;border-left:none}
 .book.open ~ .tabhandle{right:100vw}
 .spine{width:44px} .hud{left:58px;top:16px;max-width:64vw} .hud__n{font-size:27px}
 .rail{left:58px;bottom:20px;max-width:calc(100vw - 130px)}
 .ctl{bottom:20px;right:16px}
 .book.open ~ .rail,.book.open ~ .ctl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<div id="grain" aria-hidden="true"></div>

<div class="spine" aria-hidden="true">
 <div class="seal"><span>殇</span></div>
 <div class="spine__t">葬天<em>殇</em></div>
 <div class="spine__f">界域全图</div>
</div>

<div class="hud">
 <div class="hud__z" id="hudZ">全　象</div>
 <div class="hud__n" id="hudN">诸天</div>
 <div class="hud__a" id="hudA">一切界域的总称</div>
</div>

<aside class="book" id="book">
 <div class="book__tabs" role="tablist">
  <button class="btab" role="tab" aria-selected="true"  data-pane="pane-geo">地志</button>
  <button class="btab" role="tab" aria-selected="false" data-pane="pane-rank">境界</button>
  <button class="btab" role="tab" aria-selected="false" data-pane="pane-law">法度</button>
  <button class="btab" role="tab" aria-selected="false" data-pane="pane-chr">沿革</button>
 </div>
 <div class="book__body">
  <div class="bpane on" id="pane-geo" role="tabpanel"></div>
  <div class="bpane" id="pane-rank" role="tabpanel"></div>
  <div class="bpane" id="pane-law" role="tabpanel"></div>
  <div class="bpane" id="pane-chr" role="tabpanel"></div>
 </div>
</aside>
<button class="tabhandle" id="tabhandle" aria-expanded="false">卷宗</button>

<nav class="rail" id="rail" aria-label="界域索引"></nav>

<div class="ctl">
 <button class="cbtn tal" id="talisman" aria-pressed="false" title="通行符 · 显现福地">通行符</button>
 <button class="cbtn" id="zin" aria-label="向内" title="向内">近</button>
 <button class="cbtn" id="zout" aria-label="向外" title="向外">远</button>
 <button class="cbtn" id="zres" aria-label="复归全图" title="复归全图">归</button>
</div>

<div class="tip" id="tip">
 <b>滚 轮 深 入 · 拖 曳 观 览</b>
 <span>一图之内层层相嵌，愈往里愈是此界深处</span>
</div>
<script>
/* ══════════ 舆图笔法 ══════════ */
var C={
 ink:"#100D0C", ink2:"#171310",
 line:"#4A3F36", line2:"#6E5F51", ghost:"#2A231F",
 silk:"#D3C4A6", silk2:"#9E8F79", silk3:"#6B5D4E", moon:"#EFE7D6",
 cin:"#AE3A2B", cin2:"#D06A55", cinDim:"#4A2019", cinSilk:"#DCB39F",
 gold:"#B4913F", goldDim:"#5E4A22", goldSilk:"#E0C784",
 land:"#B7A57F", landHi:"#CDBC94", landLo:"#8D7C5D", coast:"#E2D3A8",
 warm:"#96704F", warmLo:"#6B4C36", warmHi:"#BC8F63",
 dark:"#4C3931", darkLo:"#2A1E1C", darkHi:"#7E5648",
 violet:"#584655", violetHi:"#9A8093",
 sea:"#213533", seaLo:"#152322", seaHi:"#3C5A55",
 pen:"#2C241D", pen2:"#50442F"
};
function n2(v){return Math.round(v*10)/10;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function rnd(s){var x=s;return function(){x=(x*1103515245+12345)%2147483648;return x/2147483648;};}

function spline(p,open){
 var n=p.length,d="M"+n2(p[0][0])+" "+n2(p[0][1]),lim=open?n-1:n;
 for(var i=0;i<lim;i++){
  var a=open?p[Math.max(0,i-1)]:p[(i-1+n)%n], b=p[i%n],
      c=open?p[i+1]:p[(i+1)%n], e=open?p[Math.min(n-1,i+2)]:p[(i+2)%n];
  d+=" C"+n2(b[0]+(c[0]-a[0])/6)+" "+n2(b[1]+(c[1]-a[1])/6)+","
   +n2(c[0]-(e[0]-b[0])/6)+" "+n2(c[1]-(e[1]-b[1])/6)+","+n2(c[0])+" "+n2(c[1]);}
 return d+(open?"":"Z");}

/* 多频海岸线 */
function coast(cx,cy,rx,ry,seed,o){
 o=o||{};var wob=o.wob==null?.32:o.wob,n=o.n||34,lb=o.lobes||3;
 var R=rnd(seed),p=[],ph=[R()*6.28,R()*6.28,R()*6.28];
 for(var i=0;i<n;i++){var a=i/n*6.2832;
  var k=1+wob*(.55*Math.sin(lb*a+ph[0])+.3*Math.sin(7*a+ph[1])+.15*Math.sin(13*a+ph[2]));
  k*=1+(R()-.5)*.1;
  p.push([cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]);}
 return spline(p);}

/* 陆地：主体 + 岸线晕 + 内缩等深线 */
function landmass(cx,cy,rx,ry,seed,o){
 o=o||{};var d=coast(cx,cy,rx,ry,seed,o);
 var fill=o.fill||C.land, edge=o.edge||C.coast, id=o.id||("l"+seed);
 var s='<path d="'+d+'" fill="'+fill+'" stroke="'+edge+'" stroke-width="'+(o.sw||3)+'"/>';
 if(o.halo!==false)s='<path d="'+d+'" fill="none" stroke="'+edge+'" stroke-width="'+((o.sw||3)*3.4)+'" opacity=".13"/>'+s;
 s+='<clipPath id="'+id+'"><path d="'+d+'"/></clipPath>';
 return {d:d,svg:s,clip:id};}

/* 山脉 */
function mts(x,y,n,sc,seed,tone){
 var R=rnd(seed),s='',f=tone==="warm"?C.warmLo:(tone==="dark"?C.darkLo:C.landLo),
  st=tone==="warm"?C.warmHi:(tone==="dark"?C.darkHi:C.coast);
 for(var i=0;i<n;i++){var px=x+i*22*sc,h=(24+R()*26)*sc,w=(16+R()*7)*sc,b=y+(i%2?6*sc:0);
  s+='<path d="M'+n2(px-w)+' '+n2(b)+'L'+n2(px)+' '+n2(b-h)+'L'+n2(px+w)+' '+n2(b)+'Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+n2(1*sc)+'" stroke-linejoin="round"/>';
  s+='<path d="M'+n2(px)+' '+n2(b-h)+'L'+n2(px+w*.34)+' '+n2(b-h*.46)+'L'+n2(px+w)+' '+n2(b)+'Z" fill="'+C.pen+'" opacity=".3"/>';}
 return s;}
/* 林 */
function woods(x,y,w,h,n,seed,col){
 var R=rnd(seed),s='';
 for(var i=0;i<n;i++){var px=x+R()*w,py=y+R()*h,r=3+R()*3;
  s+='<path d="M'+n2(px)+' '+n2(py)+'l'+n2(-r)+' '+n2(r*1.5)+'h'+n2(r*2)+'Z" fill="'+(col||C.pen2)+'" opacity="'+n2(.35+R()*.35)+'"/>';}
 return s;}
/* 河 */
function river(pts,w,col){var d=spline(pts,1);
 return '<path d="'+d+'" fill="none" stroke="'+(col||C.seaHi)+'" stroke-width="'+(w||6)+'" stroke-linecap="round" opacity=".78"/>'

function waves(x,y,w,h,seed,col,step){

/* 云雾 */
function cloud(x,y,w,op,col){var h=w*.22;

 +'c'+n2(w*.12)+' '+n2(-h*.8)+' '+n2(w*.36)+' '+n2(-h*.58)+' '+n2(w*.46)+' 0'
 +'c'+n2(w*.1)+' '+n2(-h*.22)+' '+n2(w*.2)+' '+n2(h*.04)+' '+n2(w*.14)+' '+n2(h*.12)+'Z" fill="'+(col||"#DCD2B4")+'" opacity="'+(op||.14)+'"/>';}
/* 星尘 */
function stars(x,y,w,h,n,seed,col){

/* 岛群 */
function isles(x,y,w,h,n,seed,o){

 for(var i=0;i<n;i++){var px=x+R()*w,py=y+R()*h,rx=(o.min||9)+R()*((o.max||26)-(o.min||9)),ry=rx*(.42+R()*.3);
  if(o.skip&&o.skip(px,py,rx))continue;
  s+='<path d="'+coast(px,py,rx,ry,(seed+i*97)|0,{wob:.36,n:14,lobes:3})+'" fill="'+(R()>.66?C.landHi:C.land)+'" stroke="'+C.coast+'" stroke-width="1.1" opacity="'+n2(.45+R()*.5)+'"/>';}
 return s;}

/* ── 文字 ── */
function T(x,y,t,o){o=o||{};
 var sw=o.sw!=null?o.sw:Math.max(1.2,Math.min(2.6,(o.size||14)*0.09)),sk=o.stroke||C.ink;
 var a=['x="'+n2(x)+'" y="'+n2(y)+'"','fill="'+(o.fill||C.silk)+'"','font-size="'+(o.size||14)+'"',
  'paint-order="stroke"','stroke="'+sk+'"','stroke-width="'+n2(sw)+'"','stroke-linejoin="round"','stroke-linecap="round"'];
 if(o.cls)a.push('class="'+o.cls+'"');
 if(o.anchor)a.push('text-anchor="'+o.anchor+'"');
 if(o.ls!=null)a.push('letter-spacing="'+o.ls+'"');
 if(o.w)a.push('font-weight="'+o.w+'"');
 if(o.op!=null)a.push('opacity="'+o.op+'"');
 if(o.rot)a.push('transform="rotate('+o.rot+' '+n2(x)+' '+n2(y)+')"');
 return '<text '+a.join(" ")+'>'+esc(t)+'</text>';}
/* 竖排 */
function VT(x,y,t,o){o=o||{};var sz=o.size||30,ls=sz*1.16,r='';
 for(var i=0;i<t.length;i++)r+=T(x,y+i*ls,t.charAt(i),{size:sz,fill:o.fill||C.moon,anchor:"middle",w:o.w,cls:o.cls,stroke:o.stroke,sw:o.sw});
 return r;}
/* 区域题名（图面大字，字距开张）—— 大字不描边避免糊，副标题保留细描边 */
function region(x,y,name,sub,o){
 o=o||{};var fs=o.size||60,fl=o.fill||C.pen;
 var lt=(fl===C.moon||fl===C.silk||fl===C.goldSilk||fl===C.cinSilk||fl===C.coast);
 var sk=lt?C.ink:C.coast;
 var s=T(x,y,name,{size:fs,fill:fl,anchor:"middle",ls:fs*.3,w:600,cls:o.cls,stroke:"none",sw:0});
 if(sub)s+=T(x,y+fs*.78,sub,{size:fs*.3,fill:o.sub||C.pen2,anchor:"middle",ls:fs*.12,cls:o.cls2||o.cls,stroke:sk,sw:Math.max(1.2,fs*.025)});
 return s;}
/* 地名标注：精致地标 + 引线 + 名 + 类 —— 图标带光晕与虚线装饰环，文字带描边衬底 */
function mark(x,y,name,kind,o){
 o=o||{};var side=o.side||"r",fs=o.fs||26,L=o.len||fs*2.2,d=(side==="r"?1:-1),

 s+='<circle cx="'+n2(x)+'" cy="'+n2(y)+'" r="'+n2(r*2.3)+'" fill="none" stroke="'+col+'" stroke-width="1" opacity=".35" stroke-dasharray="2 4"/>';
 s+='<circle cx="'+n2(x)+'" cy="'+n2(y)+'" r="'+n2(r)+'" fill="'+C.ink+'" stroke="'+col+'" stroke-width="2"/>';
 s+='<circle cx="'+n2(x)+'" cy="'+n2(y)+'" r="'+n2(r*.34)+'" fill="'+col+'"/>';
 s+='<circle cx="'+n2(x)+'" cy="'+n2(y-r*2.3)+'" r="1.5" fill="'+col+'" opacity=".45"/>';
 s+='<circle cx="'+n2(x)+'" cy="'+n2(y+r*2.3)+'" r="1.5" fill="'+col+'" opacity=".45"/>';
 s+='<circle cx="'+n2(x-r*2.3)+'" cy="'+n2(y)+'" r="1.5" fill="'+col+'" opacity=".45"/>';
 s+='<circle cx="'+n2(x+r*2.3)+'" cy="'+n2(y)+'" r="1.5" fill="'+col+'" opacity=".45"/>';
 s+='<path d="M'+n2(x+d*(r*2.3+4))+' '+n2(y)+'H'+n2(tx-d*5)+'" stroke="'+col+'" stroke-width="1.4" opacity=".75"/>';
 s+=T(tx,y+fs*.34,name,{size:fs,fill:col,anchor:side==="r"?"start":"end",w:600,stroke:C.ink,sw:fs*.12});
 if(kind)s+=T(tx,y+fs*.34+fs*1.12,kind,{size:fs*.5,fill:sub,anchor:side==="r"?"start":"end",cls:o.kcls,stroke:C.ink,sw:fs*.08});
 return s+'</g>';}
/* 小地物标记 —— 精致菱形地标，外光晕+虚线装饰环+中心菱形 */

 s+='<path d="M'+n2(x)+' '+n2(y-r*.5)+'L'+n2(x+r*.5)+' '+n2(y)+'L'+n2(x)+' '+n2(y+r*.5)+'L'+n2(x-r*.5)+' '+n2(y)+'Z" fill="'+col+'"/>';
 s+=T(x,y-r-12,name,{size:fs,fill:col,anchor:"middle",w:600,stroke:C.ink,sw:fs*.14});

/* 亭台屋宇 */
function hall(x,y,sc,col,edge){

 +'<path d="M'+n2(-w*.24)+' '+n2(h)+'V'+n2(h*.2)+'h'+n2(w*.48)+'V'+n2(h)+'" fill="none" stroke="'+(edge||C.pen)+'" stroke-width="'+n2(1.6*sc)+'"/></g>';}
/* 分幅图廓 */
function inset(x,y,w,h,title,note,o){
 o=o||{};var k=o.edge||C.line2;
 var s='<g class="inset">';
 s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(o.bg||C.ink2)+'" stroke="'+k+'" stroke-width="3"/>';
 s+='<rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+(w-18)+'" height="'+(h-18)+'" fill="none" stroke="'+k+'" stroke-width="1" opacity=".65"/>';
 /* 题头 */
 var tw2=title.length*38+(note?note.length*19+34:0)+70;
 s+='<rect x="'+(x+26)+'" y="'+(y-27)+'" width="'+tw2+'" height="54" fill="'+C.ink+'" stroke="'+k+'" stroke-width="2.4"/>';
 s+=T(x+52,y+12,title,{size:34,fill:C.moon,w:600,ls:5});

/* 索引线：从主图某点引至分幅图 */
function indexLine(pts,label,o){
 o=o||{};var d=spline(pts,1),col=o.col||C.cin;
 var s='<g class="idx">';
 s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="4.5" stroke-dasharray="16 11" opacity="1"/>';
 var e=pts[pts.length-1],p=pts[pts.length-2];
 var a=Math.atan2(e[1]-p[1],e[0]-p[0]);
 s+='<path d="M'+n2(e[0])+' '+n2(e[1])+'L'+n2(e[0]-Math.cos(a-.4)*20)+' '+n2(e[1]-Math.sin(a-.4)*20)
  +'L'+n2(e[0]-Math.cos(a+.4)*20)+' '+n2(e[1]-Math.sin(a+.4)*20)+'Z" fill="'+col+'"/>';
 if(label){var m=pts[Math.floor(pts.length/2)]; m=[m[0],m[1]-46];
  s+='<rect x="'+n2(m[0]-label.length*9-9)+'" y="'+n2(m[1]-18)+'" width="'+n2(label.length*18+18)+'" height="34" fill="'+C.ink+'" stroke="'+col+'" stroke-width="1.4"/>';
  s+=T(m[0],m[1]+6,label,{size:17,fill:C.cinSilk,anchor:"middle"});}
 return s+'</g>';}
/* 经纬网 */
function graticule(x,y,w,h,step,col,op){
 var s='<g opacity="'+(op||.13)+'">';
 for(var gx=x;gx<=x+w;gx+=step)s+='<path d="M'+gx+' '+y+'V'+(y+h)+'" stroke="'+(col||C.line2)+'" stroke-width="1"/>';
 for(var gy=y;gy<=y+h;gy+=step)s+='<path d="M'+x+' '+gy+'H'+(x+w)+'" stroke="'+(col||C.line2)+'" stroke-width="1"/>';
 return s+'</g>';}
/* 方位罗盘 */
function compass(cx,cy,r,col){
 var c=col||C.silk2,s='<g>';
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="2" opacity=".8"/>';
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.72)+'" fill="none" stroke="'+c+'" stroke-width="1" opacity=".5"/>';
 for(var k=0;k<8;k++){var a=k*Math.PI/4,L=(k%2?r*.52:r*.96);
  s+='<path d="M'+n2(cx+Math.cos(a-.12)*r*.16)+' '+n2(cy+Math.sin(a-.12)*r*.16)
   +'L'+n2(cx+Math.cos(a)*L)+' '+n2(cy+Math.sin(a)*L)
   +'L'+n2(cx+Math.cos(a+.12)*r*.16)+' '+n2(cy+Math.sin(a+.12)*r*.16)+'Z" fill="'+(k%2?"none":c)+'" stroke="'+c+'" stroke-width="1.4" opacity="'+(k%2?.6:.85)+'"/>';}
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.1)+'" fill="'+c+'"/>';
 s+=T(cx,cy-r-14,"北",{size:r*.32,fill:c,anchor:"middle",w:600});
 return s+'</g>';}
/* 四角云纹 */
function corner(x,y,dx,dy,L,col){
 var c=col||C.line2,s='<g opacity=".75">';
 s+='<path d="M'+x+' '+(y+dy*L)+'V'+y+'H'+(x+dx*L)+'" fill="none" stroke="'+c+'" stroke-width="3"/>';
 s+='<path d="M'+(x+dx*16)+' '+(y+dy*(L*.6))+'q0 '+(-dy*L*.3)+' '+(dx*L*.3)+' '+(-dy*L*.3)
  +'q'+(dx*L*.3)+' 0 '+(dx*L*.3)+' '+(-dy*L*.28)+'" fill="none" stroke="'+c+'" stroke-width="1.6" opacity=".7"/>';
 return s+'</g>';}
/* 题签 */
function cartouche(x,y,name,sub,seal,size){
 var sz=size||44, by=y+(name.length-1)*sz*1.16+sz*.56;
 var subH=sub?sub.length*sz*.32*1.16:0;
 var bw=sz*(sub?1.8:1.06), bh=Math.max(by+sz*.7-y+sz*.95, subH+sz*.95);
 var s='<g class="cart">';
 s+='<rect x="'+n2(x-sz*.66)+'" y="'+n2(y-sz*.86)+'" width="'+n2(bw)+'" height="'+n2(bh)+'" fill="rgba(14,11,10,.86)" stroke="'+C.line+'" stroke-width="1.6"/>';
 s+='<rect x="'+n2(x-sz*.66+5)+'" y="'+n2(y-sz*.86+5)+'" width="'+n2(bw-10)+'" height="'+n2(bh-10)+'" fill="none" stroke="'+C.line+'" stroke-width=".8" opacity=".7"/>';
 s+=VT(x,y,name,{size:sz,fill:C.moon,w:600});
 s+='<rect x="'+n2(x-sz*.32)+'" y="'+n2(by)+'" width="'+n2(sz*.64)+'" height="'+n2(sz*.64)+'" fill="none" stroke="'+C.cin+'" stroke-width="2"/>';
 s+=T(x,by+sz*.48,seal,{size:sz*.4,fill:C.cin2,anchor:"middle",w:600});
 if(sub)s+=VT(x+sz*.98,y+sz*.06,sub,{size:sz*.32,fill:C.silk2});
 return s+'</g>';}

/* 疆域轮廓 —— 父层与子层共用，故缩放时形廓连续 */
function shapeOf(id){
 var n=L[id],W=n.W,H=n.H;
 if(n.shape==="disc"){var rx=W*.47,ry=H*.47;
  return 'M'+(W/2-rx)+' '+(H/2)+'a'+rx+' '+ry+' 0 1 0 '+(2*rx)+' 0a'+rx+' '+ry+' 0 1 0 '+(-2*rx)+' 0Z';}
 if(n.shape==="tower")return 'M'+(W*.30)+' '+(H*.06)+'L'+(W*.14)+' '+(H*.955)+'H'+(W*.86)+'L'+(W*.70)+' '+(H*.06)+'Z';
 if(n.shape==="strata")return 'M'+(W*.04)+' '+(H*.03)+'H'+(W*.96)+'V'+(H*.97)+'H'+(W*.04)+'Z';
 if(n.shape==="void")return 'M0 0H'+W+'V'+H+'H0Z';
 return coast(W/2,H/2,W*.46,H*.45,n.sd||7,{wob:n.wob||.3,n:36,lobes:n.lobes||3});
}
function fillOf(id){var t=L[id].tone;
 return t==="dark"?C.dark:t==="warm"?C.warm:t==="violet"?C.violet:t==="gold"?"#2A2214":
  (L[id].shape==="sea"?C.sea:C.land);}
function edgeOf(id){var t=L[id].tone;
 return t==="dark"?C.darkHi:t==="warm"?C.warmHi:t==="violet"?C.violetHi:t==="gold"?C.gold:
  (L[id].shape==="sea"?C.seaHi:C.coast);}
function ph(id){var n=L[id];return n.at.w*n.H/n.W;}
/* 子地块在本层中的位置（供绘制引线、注记对位） */
function kidBox(id){var n=L[id],a=n.at;return {x:a.x,y:a.y,w:a.w,h:ph(id),cx:a.x+a.w/2,cy:a.y+ph(id)/2};}
/* 在本层中画出子地块的轮廓预示（子层未显时可见，子层显时被其完全覆盖） */
function kidHint(id,o){o=o||{};
 var n=L[id],a=n.at,sc=a.w/n.W;
 return '<g transform="translate('+a.x+' '+a.y+') scale('+n2(sc)+')">'
  +'<path d="'+shapeOf(id)+'" fill="'+fillOf(id)+'" stroke="'+edgeOf(id)+'" stroke-width="'+n2((o.sw||2.4)/sc)+'"/></g>';}

 desc:"最上面的<strong>三层天</strong>垄断了所剩无几的不死物质以及修炼资源，面积宽广无比。他们任由下界自生自灭，只是偶尔前往下面的<strong>三十三重天</strong>挖掘人才，同时不允许他们再回去。孟古后来翻阅史书、四处打听，发现了这桩垄断，在被拒绝返回后以破界符强行离去，并将真相公之于众。",
 lmk:[{n:"上三重天",d:"垄断不死物质与修炼资源，只取人才，不许回返"},{n:"下三十三重天",d:"自生自灭之地，清乐天在其中"},{n:"界壁",d:"下界大能燃烧本源强攻处，终致谈判"}]},

shangsan:{name:"上三重天",alias:"三十六重天最上三层",W:1200,H:340,parent:"sanshiliu",depth:7,
 
 scale:"面积宽广无比",law:"末法，然垄断资源",gate:"—",
 desc:"垄断了所剩无几的<strong>不死物质</strong>以及修炼资源。任由下界自生自灭，只是偶尔前往下面的三十三重天挖掘人才，同时不允许他们再回去。孟古正是靠出色的实力一路平推，成为前往上界的人选之一；此后翻查史书、四处打听，才发现了这桩垄断，被拒绝返回后以破界符强行离去，并将真相公之于众——由此引来下界顶层战力齐出，欲打破界壁强夺不死物质与资源。",
 lmk:[{n:"不死物质",d:"所剩无几，为上界所垄断"},{n:"选才之路",d:"只上不下，入选者不许回返"}]},

qingle:{name:"清乐天",alias:"下三十三重天之一 · 中等之天",W:1000,H:1000,parent:"sanshiliu",depth:7,

 desc:"由<strong>靖安大陆</strong>与其他五大域共同组成，实力与面积在三十六重天中处于中等水平。清乐天之外，则是虚空星海以及混沌。",
 lmk:[{n:"靖安大陆",d:"六域之一，孟古故乡所在"},{n:"瑞梦府",d:"孟古入道之门。掌门丘炀，师兄宇正。位置原纲未详"},{n:"永泽山",d:"远方一个更好的门派，丘炀荐孟古往彼求道。位置原纲未详"}]},

wuyu:{name:"其他五大域",alias:"清乐天六域之五",W:900,H:900,parent:"qingle",depth:8,
 
 scale:"与靖安大陆共同组成清乐天",law:"末法",gate:"—",
 desc:"靖安大陆与其他五大域共同组成了清乐天。此五域之名与形，原纲未详——图中仅以六分之势示其位，不作增补。",lmk:[]},

xuhai:{name:"虚空星海 · 混沌",alias:"清乐天之外",W:1200,H:800,parent:"qingle",depth:8,
 
 scale:"未详",law:"混沌",gate:"元始（仙王）已可在混沌中立下自己的道场，演绎宇宙星空",
 desc:"清乐天之外则是虚空星海以及混沌。仙王境已能开辟世界、在混沌中立下自己的道场，演绎宇宙星空；真仙能够炼化的宇宙，仙王可以一手托住。",lmk:[]},

jingan:{name:"靖安大陆",alias:"清乐天六域之一",W:1200,H:780,parent:"qingle",depth:8,
 
 scale:"六域之一；承阳州占其三分之一",law:"末法",gate:"—",
 desc:"清乐天六域之一。<strong>承阳州</strong>占据靖安大陆三分之一的面积；其余疆土，原纲未详。孟古自此地启程，此后走过塔层、界海与上苍，再未回到起点。",
 lmk:[{n:"承阳州",d:"占大陆三分之一，远安村在其中"}]},

chengyang:{name:"承阳州",alias:"靖安大陆三分之一",W:1000,H:650,parent:"jingan",depth:9,
 
 scale:"占靖安大陆三分之一的面积",law:"末法",gate:"—",
 desc:"靖安大陆上最大的一块疆土。众门派当年不愿牵连尚在襁褓的孟古，变换其本源气息之后，将他送入这里的一座村子。",
 lmk:[{n:"远安村",d:"孟古被送入抚养之地"}]},

yuanan:{name:"远安村",alias:"起点",W:1000,H:620,parent:"chengyang",depth:10,
 
 scale:"一村",law:"末法。凡人亦可居",gate:"凡体亦可修道，唯效果不佳",
 desc:"孟古的父亲是一方大寇，母亲是邪修，被众门派追杀而死。死前众人不愿牵连还是婴儿的孟古，变换他的本源气息后送入此村，希望日后不致因父母之故迁怒于他。他在此长大，成人后决心踏上修炼之路——为寻清身世，也为出人头地，日后好报答村长等人的收养之恩。<br><br>他后来走到了这一切的尽头。而尽头处，他自焚过去现在未来，断裂过往时空，让所有殇与痛与自己陪葬。",
 lmk:[{n:"村长家",d:"收养孟古者"}]},

fudi:{name:"福地",alias:"一位受伤仙帝的道场 · 浮游于诸天",W:900,H:580,parent:null,depth:-1,
 
 scale:"可出现在诸天万界各个地方",law:"不受界壁约束",gate:"持通行符者，可在任何地方显现其投影而入",
 desc:"这道场可以出现在诸天万界各个地方，等待有缘人进来带走机缘。孟古在破障境时机缘巧合入内，炼化了一朵<strong>混沌莲</strong>，之后以混沌大道融入本源之心；离开时结交了受伤仙帝的一番弟子，最低也是仙王境界，又顺走了一块<strong>通行符</strong>——从此可在任何地方显现福地投影然后进入。此后他多次重回此地求仙缘、学法，带走仙药珍宝与一块<strong>破界符</strong>。被准仙王追杀时，他显露出这处福地，惊跑数位大人物；后来杀他的那位准仙帝再度出手，也被福地中的一位准仙帝阻止，并放话诸天：境界高于孟古者不得出手，否则必将以牙还牙。",
 lmk:[{n:"混沌莲",d:"孟古所炼化，以混沌大道融入本源之心"},{n:"通行符",d:"可在任何地方显现福地投影"},{n:"破界符",d:"强行离开上界所用"}]}
};
var TIERS=[
{cls:"",title:"人道领域",note:"人道领域有其顶点。孟古在此路断处强开一条路，登临圣尊极巅，而后破塔。",steps:[
{n:1,name:"炼体",gate:"",d:"修炼肉身体魄。大部分修炼此体系的修士，都会选择这个境界作为自身的第一个境界。"},
{n:2,name:"淬魂",gate:"",d:"淬炼神魂，凝聚元神，提高神识与精神攻击。"},
{n:3,name:"合道",gate:"",d:"与大道沟通、交融，选择适合自己的道，将它们为己所用，可增强攻击力并领悟道法。修炼此境界后，大部分修士都可以御空飞行、动用法术。"},
{n:4,name:"御一",gate:"",d:"炼体、淬魂、合道三大境界合一，完善修炼成果。此境界可以引动三条路在体内，汇聚成<strong>本源之心</strong>，是这种体系的重点之一。"},
{n:5,name:"破障",gate:"",d:"破开身体中的障碍，逆转死穴，打通人体穴位，突破更强战力，同时开启各种秘技。每个部位都有可能诞生绝世功法，例如火眼金睛等等。"},
{n:6,name:"太虚",gate:"",d:"意识空灵，感悟三千大道，选择一种承载于本源之心中。大部分人一生专修一种，也有人可以修炼多种大道，相互融汇。"},
{n:7,name:"玄门",gate:"秘法 · 非通途",d:"分为天、地、人三门。大部分人只能触摸到某一门的边框，绝世天才则可以开启全部三门。<strong>天门</strong>增强与大道的沟通；<strong>人门</strong>增加悟性并增强元神；<strong>地门</strong>提升力量，叠加在一切攻击之上。此境界为一家族的秘法，是向一位准仙帝始祖借取力量。"},
{n:8,name:"通天",gate:"清乐天",d:"御一境之后的一个大境界。蜕变肉身，自身道法升华，向圆满接近。这一境界超越大部分修炼此体系的修士，可以称霸一方——<strong>初入通天境，就可数分钟横渡清乐天</strong>。"},
{n:9,name:"准圣尊",gate:"三十六重天 · 下界",d:"相比通天境综合增幅十到百倍，可以在三十六重天的下界来去自如。"},
{n:10,name:"小圣尊",gate:"三十六重天 · 多数塔层",d:"纵横三十六重天与多数塔层，碾压准圣尊及以下境界的修士。"},
{n:11,name:"大圣尊",gate:"妖尊塔 · 门户",d:"有能力一统妖尊塔。妖尊塔中的大圣尊掌控进出的大门，也有能力送后人和弟子外出历练。"},
{n:12,name:"圣尊极巅",gate:"破塔 · 得见仙界",d:"法则与神通修炼圆满，达到<strong>人道领域的巅峰</strong>。抬手可以崩裂宇宙，一缕气息就能压迫低境界修士；绝世高手可与真仙一战，可杀较弱的真仙。在妖尊塔中可以来去自如，多个圣尊极巅的绝顶人物有可能联手破开妖尊塔。"}]},
{cls:"tier--i",title:"仙道",note:"末法乃至绝灵世界中造就的仙，须在红尘中度过多世、不断蜕变方能长生，故实力远强于在仙界成仙者，大部分可达仙尊以上。",steps:[
{n:13,name:"不朽",sub:"真仙",gate:"一个大宇宙",d:"一滴血能保持数个纪元不灭，长生不死，肉身不朽，元神不灭。此层次的<strong>红尘仙</strong>，战力比真仙更强。一般真仙就可以炼化一个大宇宙——例如妖尊，便是炼化了一大片世界融入塔中。真仙可以在有成仙环境的世界中修炼而成，渡过成仙劫成仙；也可以在末法世界甚至绝灵世界造就，这样的真仙实力强劲，直追准仙王甚至真正的仙王。"},
{n:14,name:"元始",sub:"仙王",gate:"界海 · 时间长河",d:"真正长生不死，肉身不朽，元神不灭，仅修成仙王体就能让体魄更强，极难杀死，除非用特殊方法。若有人念其真名，就会被他们感知，会有异象显化。已经可以开辟世界，在混沌中立下自己的道场，演绎宇宙星空。仙王境便能自由穿梭在各个宇宙中，真仙能够炼化的宇宙也可以一手托住，有能力在界海中行进。能踏足于时间长河，穿梭过去未来，无视岁月的力量，在时光长河进行小规模的修改。"},
{n:15,name:"真一",sub:"仙尊",gate:"上苍 · 万年横渡",d:"达到此境界便能够在上苍畅行，只需万年就可以横渡上苍，有安全往返大界虚空等地的能力，远强过仙王境。绝世天才有越级与准仙帝一战的可能。"},
{n:16,name:"临峰",sub:"准仙帝",gate:"各个时空",d:"修炼体系的奠基人，弹指间能毁灭一界域，自身就能蒙蔽天机——无论过去、现在或殒落后都带着迷雾，让人难以看透。在某些纪元则被称之为<strong>帝者</strong>，也被称为<strong>道祖</strong>，多是一个体系的开创者、奠基人、拓路者，实力都极尽强大，远超仙王，有足够的能力游走在各个时空中。"},
{n:17,name:"道绝",sub:"仙帝 / 路尽级",gate:"上苍 · 一念横穿",d:"诸天间，对走到了进化体系尽头的生灵的一种统称，为道之极致、路之尽头；是所有进化支路已知的最高境界，一念就可以横穿上苍。在不同的体系中有不同的尊称，相当于仙族的仙帝。若无特殊手段，则<strong>仙帝不死，路尽不灭</strong>——只要世间还有人记得他，念他的名字，他就会重归。"}]},
{cls:"tier--b",title:"超脱",note:"若不能在绝境中复苏、或在破灭中崛起，就无法突破归墟境，只能变成一尊没有自我意识的神像，甚至只有一道虚影——虽然强大，却永远冷眼旁观人世间。",steps:[
{n:18,name:"天元",gate:"高原 · 异界",d:"修一到三种真义，而后合一。即使在高原上也有极速行进的能力，前往异界不受压制。<strong>有</strong>与<strong>无</strong>是最强大的两种真义，有直通归墟的可能，但大部分都迷失其中，走火入魔，进入无中不能超脱。"},
{n:19,name:"祭道",gate:"可令仙帝永寂",d:"焚尽规则与秩序，祭掉至高大道。仙帝极尽升华后所到达的最终的境界，迄今为止一切进化路最后的顶点。该境界者可让仙帝永寂。"},
{n:20,name:"祭我",gate:"超越永恒",d:"彻底的超越者，不死不灭。想要踏入此领域，需要拥有不可磨灭的经历。在这特殊的所在领域，所有大道皆如水流，一念可蒸干。命运、造化、因果、天道等，不过是最为虚弱的泡影，不及伸手触碰就崩灭。这里没有时间，没有空间之感，超越所谓的永恒、道、大千世界、所有时空、宇宙之外、混沌之外，无所不在。"},
{n:21,name:"归墟",gate:"一切生灵的顶点",d:"万道归于一体，自身就是唯一的道，超越一切境界的存在，是所有生灵能够到达的最高顶点，但古今未来达到者寥寥可数。需在生死间明悟，在有无间转换。这一层次的生灵哪怕是祭我境也无法感知，在归墟境生灵面前一切皆为泡沫。天道、大道、本道都是处在这个层次。<span class=\"nt\">孟古是古今往来唯一以清醒状态登临此境者。其后他斩断归墟境与自身道果，从此世间再无归墟，祭我为最高顶点。</span>"}]},
{cls:"tier--s",title:"其外",note:"",steps:[
{n:22,name:"嫣然",gate:"唯一人",d:"孟古单独为千嫣然创造的一个境界，凌驾于一切境界之上。只有千嫣然一人立在这个领域。"}]}];

var LAWS=[
{t:"灵气与灵石",d:"修士以灵气为基础修炼，包括普遍存在的灵气与日月精华、草木之气、阴阳气、死气等。灵石为凡人和修士的通用货币。"},
{t:"末法之寿",d:"在末法时代，修士寿命剧减，也难以成仙，只有在红尘中度过多世、不断蜕变才能长生并提高战力。但这种仙，比在仙界中成仙的大部分要强很多，大部分可以达到仙尊以上。"},
{t:"凡体",d:"凡人并非不能修炼，而是修道天赋和体质等原因导致效果不佳，大部分毫无效果。只有小部分凡人可以修道，也就是凡体。"},
{t:"寂灭与卖世",d:"大寂灭的力量，祭我境可以阻挡一些，但效果不佳。同时高境界修士可以改变凡人或低层次修炼者的本源，让他们融入自己的大界——这也导致出现很多为了苟活而出卖自己世界的人。"},
{t:"归墟之门",d:"如果不能在绝境中复苏、或在破灭中崛起，就无法突破归墟境，只能变成一尊没有自我意识的神像，甚至只有一道虚影。虽然强大，但永远冷眼旁观人世间。"}];

var FOES=[
{t:"殇帝",d:"异界的殇帝，实力强劲，可以独战多位最顶级的修炼者。哪怕主世界顶级实力较多，也时常因为殇帝的原因损失惨重。"},
{t:"两界之秩序",d:"两界融合后的天道、大道等秩序与法则，化成一个实体的生灵，实力直逼真正的归墟境。"},
{t:"归墟之败者",d:"想要完全突破归墟境但失败的生灵，虽然实力强大但失去意识，全靠本能行动；以及一些没能完全破入归墟境的存在，只留下一道虚影。在孟古复活千嫣然、于进化路强行开路时出手，本能上认定孟古会对他们和世界本源造成威胁，对孟古造成重创。"},
{t:"天道大道之局",d:"天道大道布局，将与孟古气质样貌相近的曾经的人设计设局，想要成就自身，融合道义。但被孟古以身入局，被杀后轮回术大圆满。"}];

var CHRON=[
{t:"遗塔堕入末法",w:"妖尊塔",d:"一位妖族真仙炼化一大片世界融入塔中，其后弃之。塔因长期遗落等原因来到末法世界，连人道领域都难以走到顶点，更别提成仙破界。八十一层世界自此与外界隔绝。"},
{t:"上界垄断",w:"上三重天",d:"最上面的三层天垄断了所剩无几的不死物质与修炼资源，任由下界自生自灭，只偶尔前往下面的三十三重天挖掘人才，且不允许他们再回去。孟古强行离去并将真相公之于众。"},
{t:"界壁之战",w:"三十六重天",d:"下界顶层战力齐出，要打破界壁，强夺不死物质和资源。上界虽强者众多，但下界大能皆拼命而战、燃烧本源，最终迫使双方谈判。"},
{t:"破塔见界",w:"妖尊塔 → 仙界",g:1,d:"人道领域路断，孟古强开一条路，登临圣尊极巅，斩杀拦路之敌后破开妖尊塔，得见全象——塔处在一片废弃的空间中，外面则是妖尊的闭关地。塔中所有人第一次真正意义上接触到真实的世界，也就是第一个大地图，仙界。"},
{t:"立教仙界",w:"仙界",d:"妖尊的徒弟帮助被困的众人安排住所；孟古则将瑞梦府整个搬到了仙界中，在原本的基础上立教。"},
{t:"天庭与轮回路",w:"人间",g:1,d:"仙王极巅时欲立下轮回路，打破天地运行规律，本道降下意志惩罚，反被孟古强势掠夺本源气、炼化成逆道镯。至仙帝境建立天庭与轮回路。"},

var $=function(i){return document.getElementById(i);};
var VW=0,VH=0,cam={x:0,y:0,k:1},K0=1,cur="zhutian",rafId=0,anim=null,fudiOn=false;
var stage,world,divs={},WT={},lock=null;

function worldOf(id){if(WT[id])return WT[id];var n=L[id],r;
 if(!n.parent)r={x:0,y:0,s:1};
 else{var p=worldOf(n.parent),a=n.at;r={x:p.x+a.x*p.s,y:p.y+a.y*p.s,s:p.s*(a.w/n.W)};}
 WT[id]=r;return r;}
function ctrOf(id){var w=worldOf(id),n=L[id];return {x:w.x+n.W*w.s/2,y:w.y+n.H*w.s/2};}
function fitK(id,f){var w=worldOf(id),n=L[id];
 var k=Math.min(VW*(f||.84)/(n.W*w.s), VH*(f||.84)/(n.H*w.s));
 return (isFinite(k)&&k>0)?k:1;}
function depthOf(id){var d=0,n=L[id];while(n.parent){d++;n=L[n.parent];}return d;}

function ramp(v,a,b){return a===b?1:Math.max(0,Math.min(1,(v-a)/(b-a)));}
function setOp(el,v){if(!el)return;var s=v.toFixed(3);if(el._o!==s){el._o=s;el.style.opacity=s;el.style.display=v<=.008?"none":"";}}
function ensure(id){if(divs[id])return divs[id];
 var n=L[id];
 if(n.tr0==null){var d=DR[id]?DR[id]():{tr:'',nm:'',dt:''};n.tr0=d.tr;n.nm0=d.nm;n.dt0=d.dt;}
 var el=document.createElement("div");
 el.className="layer";el.dataset.node=id;el.style.zIndex=String(id==="fudi"?90:depthOf(id)+2);
 el.innerHTML='<svg width="'+n.W+'" height="'+n.H+'" viewBox="0 0 '+n.W+' '+n.H+'" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">'
  +'<g class="tr">'+n.tr0+'</g><g class="nm">'+n.nm0+'</g><g class="dt">'+n.dt0+'</g></svg>';
 world.appendChild(el);
 el._nm=el.querySelector(".nm");el._dt=el.querySelector(".dt");
 el._f1=el.querySelectorAll(".fine");el._f2=el.querySelectorAll(".fine2");el._f3=el.querySelectorAll(".fine3");
 divs[id]=el;return el;}

function render(){
 var ids=Object.keys(L),best=null,bs=1e9,curS=null,shown=0,bgS=-1,bgC='#0E0B0A';
 for(var i=0;i<ids.length;i++){var id=ids[i],n=L[id];
  if(id==="fudi"&&(!fudiOn||!L.fudi.parent)){if(divs[id])divs[id].style.display="none";continue;}
  var w=worldOf(id),sc=w.s*cam.k,sw=n.W*sc,sh=n.H*sc;
  var tx=(w.x-cam.x)*cam.k+VW/2, ty=(w.y-cam.y)*cam.k+VH/2;
  if(sw<VW*.02||sw>VW*34||tx>VW+60||ty>VH+60||tx+sw<-60||ty+sh<-60){
   if(divs[id])divs[id].style.display="none";continue;}
  var op=ramp(sw,VW*.02,VW*.075);
  if(op<=.015){if(divs[id])divs[id].style.display="none";continue;}
  var el=ensure(id);
  el.style.display="block";
  if(el._op!==op.toFixed(3)){el._op=op.toFixed(3);el.style.opacity=el._op;}
  var _tx=tx.toFixed(1),_ty=ty.toFixed(1),_sc=sc.toFixed(5);
  if(el._tx!==_tx||el._ty!==_ty||el._sc!==_sc){el._tx=_tx;el._ty=_ty;el._sc=_sc;
   el.style.transform="translate("+_tx+"px,"+_ty+"px) scale("+_sc+")";}
  /* 细节按远近递进显隐，绝不骤然消失（增量更新，仅在缩放档位变化时刷新） */
  var cov=Math.max(sw/VW,sh/VH);
  if(el._cov==null||Math.abs(cov-el._cov)>.05){
   el._cov=cov;
   var o1=Math.min(ramp(sw,VW*.13,VW*.30),1-ramp(sw,VW*12,VW*26));
   var o2=Math.min(ramp(sw,VW*.12,VW*.32),1-ramp(sw,VW*1.5,VW*3.6));
   var o3=Math.min(ramp(sw,VW*1.0,VW*2.6),1-ramp(sw,VW*14,VW*30));
   var oN=Math.min(ramp(sw,VW*.07,VW*.24),1-ramp(sw,VW*2.4,VW*6));
   var oD=Math.min(ramp(sw,VW*.26,VW*.60),1-ramp(sw,VW*1.8,VW*4.4));
   var q;
   for(q=0;q<el._f1.length;q++)setOp(el._f1[q],o1);
   for(q=0;q<el._f2.length;q++)setOp(el._f2[q],o2);
   for(q=0;q<el._f3.length;q++)setOp(el._f3[q],o3);
   setOp(el._nm,oN);setOp(el._dt,oD);
  }
  /* 视口中心所压的最大疆域，其色即为底色，故任何时候不露黑 */
  if(tx<=VW/2&&ty<=VH/2&&tx+sw>=VW/2&&ty+sh>=VH/2&&sw>bgS){bgS=sw;bgC=fillOf(id);}
  shown++;
  var sco=Math.abs(Math.log(cov/.85));
  if(tx>VW/2||tx+sw<VW/2||ty>VH/2||ty+sh<VH/2)sco+=2.6;
  if(id==="fudi")sco+=.12;
  if(id===cur)curS=sco;
  if(sco<bs){bs=sco;best=id;}}
 if(stage._bg!==bgC){stage._bg=bgC;stage.style.background=bgC;}
 if(best&&best!==cur&&(curS===null||bs<curS-.2)){cur=best;onCur();}
 hud();
 if(shown===0&&!anim){var c=ctrOf(cur);cam.x=c.x;cam.y=c.y;cam.k=fitK(cur,.84);return render();}
 return shown;}
function req(){if(rafId)return;rafId=requestAnimationFrame(function(){rafId=0;render();});}

var CN="〇一二三四五六七八九";
function cnum(n,inr){n=Math.round(n);if(!isFinite(n)||n<=0)return"〇";if(n<10)return CN.charAt(n);
 if(n<20)return(inr?"一十":"十")+(n%10?CN.charAt(n%10):"");
 if(n<100)return CN.charAt(Math.floor(n/10))+"十"+(n%10?CN.charAt(n%10):"");
 if(n<1000){var h=Math.floor(n/100),r=n%100;return CN.charAt(h)+"百"+(r===0?"":(r<10?"零"+CN.charAt(r):cnum(r,1)));}
 var t=Math.floor(n/1000),r2=n%1000;return CN.charAt(t)+"千"+(r2===0?"":(r2<100?"零"+cnum(r2,1):cnum(r2,1)));}
function cnZoom(m){if(!isFinite(m)||m<2.2)return"全　象";
 if(m<1e4)return"深入约"+cnum(m)+"重";
 if(m<1e8)return"深入约"+cnum(m/1e4)+"万重";
 return"深入约"+cnum(m/1e8)+"亿重";}

function deepVis(cx,cy,ck){
 cx=(cx==null?cam.x:cx);cy=(cy==null?cam.y:cy);ck=(ck==null?cam.k:ck);
 var ids=Object.keys(L),bs=1,best="zhutian";
 for(var i=0;i<ids.length;i++){var id=ids[i];if(id==="fudi")continue;
  var w=worldOf(id),n=L[id];if(w.s>=bs)continue;
  var sw=n.W*w.s*ck,sh=n.H*w.s*ck;
  var mx=(w.x-cx)*ck+VW/2+sw/2,my=(w.y-cy)*ck+VH/2+sh/2;
  var px=Math.max(sw*.5,VW*.12),py=Math.max(sh*.5,VH*.12);
  if(mx>-px&&mx<VW+px&&my>-py&&my<VH+py){bs=w.s;best=id;}}
 return best;}
function clampK(k,cx,cy){
 var kmin=Math.min(VW,VH)*.42/L.zhutian.W;
 var d=deepVis(cx,cy),wd=worldOf(d),nd=L[d];
 var kmax=Math.max(VW,VH)*2.0/Math.min(nd.W*wd.s,nd.H*wd.s);
 if(kmax<kmin)kmax=kmin;
 return Math.max(kmin,Math.min(kmax,k));}
function clampCam(){
 /* 自由状态（lock 为空）一律以根界域诸天为钳制边界，避免 cur 随视口切换导致边界突变、画面闪动 */
 var q=lock||"zhutian",n=L[q],w=worldOf(q),mw=n.W*w.s,mh=n.H*w.s;
 var px=Math.min(mw*.5,VW*.42/cam.k),py=Math.min(mh*.5,VH*.42/cam.k);
 cam.x=Math.min(Math.max(cam.x,w.x-px),w.x+mw+px);
 cam.y=Math.min(Math.max(cam.y,w.y-py),w.y+mh+py);}
function zoomAt(px,py,f){
 var nk=clampK(cam.k*f);
 cam.x+=(px-VW/2)*(1/cam.k-1/nk);cam.y+=(py-VH/2)*(1/cam.k-1/nk);
 cam.k=nk;clampCam();req();}
function chainOf(id){var c=[],n=L[id];while(n){c.unshift(n.id||id);if(!n.parent)break;id=n.parent;n=L[id];}return c;}
function routeTo(a,b){
 var pa=chainOf(a),pb=chainOf(b),i=0;
 while(i<pa.length&&i<pb.length&&pa[i]===pb[i])i++;
 var up=pa.slice(i).reverse(), down=pb.slice(i);
 var r=up.concat(down);
 if(!r.length||r[r.length-1]!==b)r.push(b);
 return r;}
/* 沿界域之链逐重下潜／上浮，绝不取直线穿过空域 */
function flyTo(id,ms){
 if(!L[id])return;
 if(anim){cancelAnimationFrame(anim);anim=null;}
 var route=routeTo(cur,id);
 if(ms===0){var c0=ctrOf(id);lock=id;cam.x=c0.x;cam.y=c0.y;
  cam.k=Math.max(clampK(fitK(id,.84),c0.x,c0.y),fitK(id,.84));clampCam();render();lock=null;return;}
 var segs=[];
 for(var i=0;i<route.length;i++){var q=route[i],c=ctrOf(q);
  segs.push({id:q,x:c.x,y:c.y,k:Math.max(clampK(fitK(q,.84),c.x,c.y),fitK(q,.84))});}
 var total=Math.min(2400,520+route.length*190), per=total/Math.max(1,segs.length);
 var si=0, s0={x:cam.x,y:cam.y,l:Math.log(cam.k)}, t0=performance.now();
 lock=id;
 (function step(t){
  var el=Math.max(0,t-t0);
  var idx=Math.max(0,Math.min(segs.length-1,Math.floor(el/per)));
  var p=Math.max(0,Math.min(1,(el-idx*per)/per));
  if(idx!==si){si=idx;var pv=segs[idx-1]||segs[0];s0={x:pv.x,y:pv.y,l:Math.log(pv.k)};}
  var e0=segs[idx], e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  cam.x=s0.x+(e0.x-s0.x)*e;cam.y=s0.y+(e0.y-s0.y)*e;
  cam.k=Math.exp(s0.l+(Math.log(e0.k)-s0.l)*e);
  clampCam();render();
  if(el<total)anim=requestAnimationFrame(step);
  else{anim=null;lock=null;var cf=ctrOf(id);cam.x=cf.x;cam.y=cf.y;
   cam.k=Math.max(clampK(fitK(id,.84),cf.x,cf.y),fitK(id,.84));clampCam();render();}
 })(t0);}
function mountFudi(){var h=L[cur];if(h.id==="fudi")return;

 delete WT.fudi;render();}

function bind(){
 stage.addEventListener("wheel",function(e){e.preventDefault();tipOff();
  var d=e.deltaY*(e.deltaMode===1?18:(e.deltaMode===2?VH:1));
  zoomAt(e.clientX,e.clientY,Math.exp(-d*0.0015));},{passive:false});
 var pts={},np=0,last=null,pinch=null,moved=0;
 stage.addEventListener("pointerdown",function(e){
  pts[e.pointerId]={x:e.clientX,y:e.clientY};np++;
  if(np===1){last={x:e.clientX,y:e.clientY};moved=0;stage.classList.add("grab");}
  else if(np===2){var k=Object.keys(pts);pinch=Math.hypot(pts[k[0]].x-pts[k[1]].x,pts[k[0]].y-pts[k[1]].y);}
  try{stage.setPointerCapture(e.pointerId);}catch(_){}});
 stage.addEventListener("pointermove",function(e){
  if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(pts);
  if(np>=2&&pinch){var nd=Math.hypot(pts[k[0]].x-pts[k[1]].x,pts[k[0]].y-pts[k[1]].y);
   if(nd>0&&pinch>0)zoomAt((pts[k[0]].x+pts[k[1]].x)/2,(pts[k[0]].y+pts[k[1]].y)/2,nd/pinch);
   pinch=nd;moved=99;tipOff();return;}
  if(last){var dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);
   cam.x-=dx/cam.k;cam.y-=dy/cam.k;last={x:e.clientX,y:e.clientY};
   if(moved>6)tipOff();clampCam();req();}});
 function up(e){if(pts[e.pointerId]){delete pts[e.pointerId];np=Math.max(0,np-1);}
  if(np===1){var _k=Object.keys(pts)[0];last={x:pts[_k].x,y:pts[_k].y};moved=0;}
  if(np<2)pinch=null;
  if(np===0){last=null;stage.classList.remove("grab");
   if(moved<7){var el=e.target,hit=null,gd=0;
    while(el&&el!==world&&gd++<12){if(el.classList&&el.classList.contains("layer")){hit=el.dataset.node;break;}el=el.parentNode;}
    if(hit&&hit!==cur){flyTo(hit);tipOff();}}}}
 stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
 stage.addEventListener("dblclick",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,2.2);tipOff();});

 document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-go],[data-step],[data-pane]"):null;
  if(!t)return;
  if(t.hasAttribute("data-go")&&!stage.contains(t)){flyTo(t.getAttribute("data-go"));tipOff();return;}
  if(t.hasAttribute("data-step")){var b=$(t.getAttribute("data-step")),op=t.getAttribute("aria-expanded")==="true";
   t.setAttribute("aria-expanded",op?"false":"true");if(b)b.classList.toggle("on",!op);return;}
  if(t.hasAttribute("data-pane")){var tb=document.querySelectorAll(".btab");
   for(var i=0;i<tb.length;i++){var on=tb[i]===t;tb[i].setAttribute("aria-selected",on?"true":"false");
    $(tb[i].getAttribute("data-pane")).classList.toggle("on",on);}}});
 document.addEventListener("keydown",function(e){
  var a=document.activeElement;

  if(e.key==="+"||e.key==="=")zoomAt(VW/2,VH/2,1.35);
  else if(e.key==="-"||e.key==="_")zoomAt(VW/2,VH/2,1/1.35);
  else if(e.key==="ArrowLeft"){cam.x-=VW*.12/cam.k;clampCam();req();}
  else if(e.key==="ArrowRight"){cam.x+=VW*.12/cam.k;clampCam();req();}
  else if(e.key==="ArrowUp"){cam.y-=VH*.12/cam.k;clampCam();req();}
  else if(e.key==="ArrowDown"){cam.y+=VH*.12/cam.k;clampCam();req();}
  else if(e.key==="Escape")flyTo("zhutian");
