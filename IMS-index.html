a1);const s1={name:"x",size:24,node:[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]};s1.node;const ks=Tt(s1),it=i=>({type:"text",text:i}),va=(i,a)=>({type:"note",title:i,text:a}),sn=(...i)=>({type:"list",items:i.map(([a,l])=>({title:a,text:l}))}),Je=(i,a)=>({type:"table",headers:i,rows:a}),ji=i=>({type:"widget",name:i}),fe=[{id:"overview",number:"01",title:"机构总览",english:"INSTITUTIONAL OVERVIEW",group:"基础文档",description:"了解 IMS 的机构性质、基本职责与共同工作语言。",sections:[{id:"identity",title:"机构定义",blocks:[it("超自然现象监察研究所（Institute for Monitoring the Supernatural，简称 IMS）是依据《异常现象联合研究与应对协约》设立的全球性独立研究与监察机构。我们调查尚未得到充分解释的现象，保存相关证据，并在确有必要时采取有限、可复核的保护措施。"),it("IMS 的日常工作发生在档案室、实验室与现场之间。历史记载、地方传说、特殊地点、来源不明的物品，以及无法稳定解释的观测结果，都可能成为研究对象。进入研究范围，不等于被认定为超自然。"),va("机构立场","未知不等于危险，未解释不等于超自然。我们首先需要知道发生了什么，然后才有资格决定应当做什么。")]},{id:"mandate",title:"核心职责",blocks:[ji("mandate"),it("观察、研究与介入并非必须依次升级的三个阶段。大多数研究可以止于解释、记录或长期观测；只有证据和现实风险共同支持时，介入才成为必要职责。")]},{id:"position",title:"全球定位",blocks:[it("IMS 不隶属于任何单一国家，不代表特定宗教、政治立场或商业利益。各地机构共享研究规范与登记体系，并通过国家联络处与当地政府、大学、博物馆及社区协作。总署负责跨区域协调，不代替所有地方机构作出日常判断。"),it("在协约启动的紧急事项中，IMS 可获得高于地方乃至国家行政命令的专项处置优先权。这种权力只针对已授权的事件、区域与期限，不构成对主权、司法或一般社会事务的常态接管。")]},{id:"boundaries",title:"工作边界",blocks:[sn(["以有限现象为对象","已确认的异常均具有具体的作用条件与有限影响范围。风险体系止于局地公共安全事件，不设人类灭绝、现实崩解或无界扩散类别。"],["以常规知识为基础","考古、历史、物理、医学与社会研究不是掩饰，而是本所开展工作的主要方法。技术能力受现有工程、资源和人员条件约束。"],["以人的生活为尺度","研究价值不能自动凌驾于人员安全、个人权利和文化遗产之上。对普通生活的干扰必须能够解释，并在任务结束后尽可能恢复。"])]},{id:"use",title:"本手册的使用",blocks:[it("本手册是各地区人员共用的机构基础文件，规定组织关系、研究边界与通用术语。它不收录具体项目记录、人员身份、总部坐标或现场行动参数，也不能替代单次任务授权。"),it("初次阅览建议依次阅读「使命与基本原则」「组织架构」及「权限与行动边界」。涉及现场工作时，应同时查阅「研究与处置流程」。不同文件发生冲突时，以正式协约、专项授权及本手册的适用层级核对，不以口头指示覆盖书面限制。")]}]},{id:"principles",number:"02",title:"使命与基本原则",english:"MISSION & PRINCIPLES",group:"基础文档",description:"在不预设答案的前提下，建立可以被检查、被质疑、被修正的认识。",sections:[{id:"mission",title:"使命声明",blocks:[it("IMS 的使命，是使未被充分理解的事物获得可靠记录，使确实存在的局地风险获得适当控制，使社会不必在恐慌与否认之间作出选择。保留问题与获得答案同样重要；证实一种普通解释，同样属于有效研究成果。"),va("共同准则","观测先于解释，证据先于判断，保护先于干预。")]},{id:"evidence",title:"证据原则",blocks:[sn(["区分经历与解释","记录受访者实际看见、听见或感受到的内容，并将其解释另列。目击描述不能自动证明其因果归属。"],["保留反例与失败","不删除未复现的结果，不把设备故障当作异常的默认特征。原始数据、校准记录、环境条件与阴性结果一并保存。"],["允许独立复核","重要判断须由未参与原始采集的人员复核。不能复现的材料标明限制，而不是以保密为理由免除检验。"],["主动修正结论","新证据足以推翻旧结论时，应更新判断并保留版本链。研究者不因合理撤回假说而受到绩效惩罚。"])]},{id:"proportion",title:"最小干预",blocks:[it("能够远程观测的，不先行封闭现场；能够局部保护的，不扩大限制范围；能够原地研究的，不以便利为由转移物品。每项干预都必须同时写明预期收益、可能损害、替代办法和退出条件。"),it("保护生命的即时措施可以先于研究安排，但不能成为无限延长管制的理由。研究进度、公众关注度和机构声誉，均不构成提高强制措施等级的独立依据。")]},{id:"dignity",title:"人与文化",blocks:[it("参与研究的人员不是耗材。访谈、医学检查和非紧急实验须取得知情同意；参与者可以撤回。不得为验证现象而诱使未获充分告知的人员进入风险环境。存在疑似认知或健康影响时，优先提供医疗与心理支持。"),it("地方传统应按其自身历史语境记录。与社区合作不意味着要求其接受 IMS 的解释；否定一个超自然假说，也不等于否定其文化意义。遗产研究应取得适用许可，尊重管理者与相关社区，不通过秘密搬迁抹去物品的来源。")]},{id:"confidentiality",title:"必要保密",blocks:[it("保密服务于人员隐私、研究完整性、设施安全和具体风险控制，不服务于维持神秘感。可以公开的常规成果应经审查后发布；不宜公开的内容须说明理由和复核时间。"),it("本所不实施普遍记忆清除，不以伪造历史替代证据管理，不把所有知情者视为敌对对象。面对公众，采用最少必要信息、真实安全说明和可持续的解释口径。")]}]},{id:"organization",number:"03",title:"组织架构",english:"ORGANIZATIONAL STRUCTURE",group:"基础文档",description:"一套统一的研究规范，分布式的专业能力，以及可以追溯的责任链。",sections:[{id:"structure",title:"机构关系",blocks:[ji("organization"),it("IMS 采用总署统筹、区域协调、研究站执行的结构。监督委员会独立于总署的日常指挥链，直接向协约理事会报告。研究质量与行动安全分别负责，避免同一负责人同时提出假说、批准危险实验并独自判定结果。")]},{id:"governance",title:"治理与监督",blocks:[Je(["机构","主要职责","不得替代的事项"],[["协约理事会","维护协约、批准年度预算、任命署长、处理成员间重大争议。","不直接修改单项研究结论。"],["总署","统一标准、调配跨区域资源、批准重大研究与应急任务。","不得免除独立审查与期限限制。"],["监督委员会","审查权限使用、研究伦理、利益冲突与人员申诉。","不担任日常现场指挥。"],["区域协调处","协调相邻地区、配置资源、维护国家联络渠道。","不得另设与总署不兼容的编号体系。"],["研究站与联络处","实施调查、实验、保管、维护与地方协作。","不得自行扩张紧急授权。"]])]},{id:"departments",title:"常设职能",blocks:[sn(["研究部 / Research","组织历史文献、民俗、自然科学与跨学科研究；维护证据标准，安排独立复核。"],["现场监察部 / Field Monitoring","承担现场踏勘、长期观测、采样及风险识别；紧急情况下组织有限的安全处置。"],["文献与登记部 / Records & Registry","维护项目编号、原始材料、版本链与保管记录；管理访问许可及对外发布。"],["设施与保障部 / Facilities & Support","负责建筑、设备、物流、医疗支持与应急维护；保管设施安全记录。"],["协约联络办公室 / Treaty Liaison","核对属地实施安排，协调政府与社区，处理授权送达、损害补偿和任务移交。"])]},{id:"teams",title:"任务组与指挥",blocks:[it("任务组按研究需要临时组成，不形成独立于常设部门的永久等级。每组至少明确研究负责人、现场安全负责人和记录负责人。小型低风险任务可以兼任记录职责，但研究与安全的最终否决职责不得由同一人独占。"),it("研究负责人决定方法与解释；现场负责人协调人员与进度；安全负责人有权暂停不安全操作。紧急状态下设单一事件指挥员，研究意见仍须记录，不得以指挥效率为由销毁异议。")]},{id:"resources",title:"资源与独立性",blocks:[it("经费来自协约成员分担、公开研究合作及经审查的专项拨款。附带控制结论、优先取得危险物品或排他获取人员资料条件的资助，不予接受。采购、借展与合作均登记利益关系。"),it("IMS 并不拥有无限资源。任务按实际风险、证据保存时效和研究价值排序。区域内能完成的工作不集中运往总部；多个研究站保留基础能力，以免单一设施故障中断全球工作。")]}]},{id:"authority",number:"04",title:"权限与行动边界",english:"AUTHORITY & LIMITS",group:"基础文档",description:"专项权力可以高于地方命令，但不能高于它自身的授权边界。",sections:[{id:"basis",title:"授权基础",blocks:[it("IMS 的权力来源是协约及参与方的实施安排，而不是研究所的名称、装备或保密等级。常态调查遵循属地许可与合作程序。参与方须设立能够执行 IMS 紧急指令的联络和行政通道。"),it("对跨境事件，总署可以依协约组织联合响应。在未建立协约实施安排的地区，常态驻在与调查须另行协商；全球工作范围不等于在任何地点天然拥有不受限制的执法权。")]},{id:"ordinary",title:"常态权限",blocks:[sn(["申请与合作","请求查阅获准材料、开展自愿访谈、进入获批地点，并与专业机构建立联合研究。"],["受托保管","依据明确的移交凭证接收物品、样本或记录；登记所有权、保管目的和返还条件。"],["提出限制建议","向相关主管机关提出暂缓施工、限制接近或调整开放范围的建议，并提交风险依据。"])]},{id:"priority",title:"紧急处置优先权",blocks:[it("当有充分理由认为延误将造成实际人身伤害、关键证据的不可逆损失或局地危害扩散，且常规协作不足以应对时，可启动紧急处置优先权。历史价值高、舆论关注大或研究者强烈怀疑，均不足以单独启动。"),it("授权生效后，在明确事项内，IMS 的现场封控、人员疏散、证据保全和相关设备使用指令，优先于地方及国家行政机关的相冲突命令。有关机构须将该事项的现场协调权移交给指定事件指挥员。"),Je(["层级","可以采取的措施","有效期与复核"],[["现场先行保护","立即撤离危险区域、暂停当前实验、保护直接面临损毁的材料。","仅维持至授权决定；2 小时内报告，不得自行扩大范围。"],["值班授权官批准","签发明确地点、对象与措施的专项优先处置令。","最长 24 小时；期间持续记录必要性。"],["总署联合续期","署长与监督委员会值班委员共同批准必要的延续或范围调整。","每次最长 72 小时；每次均须重新论证，不得自动续期。"]]),va("优先权不是一般统治权","IMS 无权接管立法、司法、选举、财政或与事件无关的行政事务；无权以研究为由无限拘留人员、征收财产或免除刑事责任。")]},{id:"accountability",title:"监督与退出",blocks:[it("处置令必须写明事实依据、空间范围、允许措施、指挥责任人、期限与终止条件，并向受影响主管机关送达。紧急救助可以先执行，书面记录不得因此免除。直接受影响人员应获知可以公开的安全说明与申诉渠道。"),it("触发条件消失、时限届满或监督复核认定依据不足时，优先权立即终止。任务组应移交现场、恢复通行、清点归还受托物品，并办理合理损害补偿。保密不得阻止合法的独立问责。")]},{id:"force",title:"安全行动限制",blocks:[it("现场安保用于隔离危险、保护人员和维持已授权秩序，不承担军事占领或政治镇压任务。使用强制手段必须符合必要性与比例原则，并单独记录。研究人员不得因拥有较高访问权限而自行取得执法或武装行动资格。")]}]},{id:"access",number:"05",title:"人员与访问级别",english:"PERSONNEL & ACCESS",group:"基础文档",description:"权限决定可以接触哪些信息，不决定一个人的价值、职称或指挥权。",sections:[{id:"levels",title:"三级访问体系",blocks:[Je(["级别","适用内容","典型使用范围"],[["L1 / 内部","共同工作规范、基础培训、经脱敏的研究概览。","完成入职审查的正式人员；本手册属于此级。"],["L2 / 专项","获派任务的原始材料、必要现场参数与工作区域。","经任务负责人申请并由登记部门确认的参与人员。"],["L3 / 受限","敏感个人资料、设施核心配置、特殊干预依据。","经总署授权及独立复核的特定职责人员。"]]),va("按需知悉","L3 不代表可以读取所有 L2 或 L3 材料。访问须同时满足级别、任务关系与有效期限；管理职位不能自动绕过这三项条件。")]},{id:"roles",title:"人员关系",blocks:[sn(["正式人员","承担持续职责，接受职业培训与定期资格复核。研究、技术、行政及安保使用同一套访问原则。"],["特聘研究者","按合作范围取得限定材料与工作区域的许可。学术头衔不自动兑换内部访问级别。"],["属地协作人员","保留原所属机构身份；在具体任务中依书面分工开展工作，不因合作而被视为永久成员。"],["访问人员与受访者","由接待人员陪同，只接触明确告知并获准的区域。受访者身份不构成安全嫌疑。"])]},{id:"grant",title:"授予与撤销",blocks:[it("访问申请应说明工作目的、所需材料、使用地点与期限。批准者与实际使用者分别留痕。任务结束、岗位变化、合作终止或出现明确安全疑虑时，权限应及时缩减或撤销，不能仅依赖人员自行停止访问。"),it("紧急情况下可签发一次性临时许可，许可只覆盖救助和事故排除所需内容，并在事后独立复核。所谓「紧急」不能用于绕过日常审批或便利常规研究。")]},{id:"handling",title:"资料处理",blocks:[it("文件级别与人员访问级别使用相同标记，但文件的可分发范围另行注明。下载、打印和离线副本不降低文件的保护要求。登记部门负责记录正式分发对象；个人书签与阅读位置不属于授权记录。"),it("复制受限材料时保留编号、版本、来源与分发说明。禁止将私有设备、未批准的外部服务或共享账户用作便利的传递渠道。发生误发时应立即报告并控制扩散，不得以删去日志掩饰。")]},{id:"welfare",title:"培训与人员保障",blocks:[it("现场资格以具体技能评估为准，包含急救、环境风险、设备操作、证据保全和社区沟通。访问等级提高不代表现场能力同步提高。任何人员都可以报告不安全行为，并在存在直接危险时停止自身操作。"),it("连续高压任务后安排休整与必要评估。对可疑体验的报告先按事实记录，不预设报告者精神异常，也不把医学问题浪漫化为超常能力。")]}]},{id:"research",number:"06",title:"研究范围",english:"RESEARCH DOMAINS",group:"研究与设施",description:"从流传已久的叙述，到可以重新测量的现场。研究不以神秘程度排序。",sections:[{id:"domains",title:"主要研究领域",blocks:[sn(["历史与文献","比对地方志、旅行记录、宗教文本、口述历史及档案中的特殊记载，追踪叙述的版本、传播路径与实际背景。"],["遗址与特殊地点","研究遗址、建筑、地形与特定环境中的反常报告。优先评估地质、声学、气象、结构与人类活动因素。"],["物品与材料","调查被赋予特殊性质的物品、来源有争议的材料，以及出现可测异常结果的器物。所有权与研究权分别处理。"],["当代现象与体验","调查异常声响、重复目击、特定场所体验及疑似超常互动。区分环境数据、主观体验和研究者的解释。"])]},{id:"heritage",title:"历史遗址的研究位置",blocks:[it("拉帕努伊（复活节岛）的石像与仪式空间、埃及的金字塔及相关墓地，可以成为历史、建筑与传说传播研究的语境。其人类文化遗产属性并不因 IMS 的关注而改变，也不应被未经证实的起源假说取代。"),it("对这类地点的工作通常是整理史料、复核测量、比较修复记录或调查特定报告，而不是将整座遗址宣布为异常对象。需要设立项目时，登记具体研究问题，不把地名本身当作异常结论。"),va("研究关注不等于异常认定","「曾被研究」只说明存在值得核对的问题。古老、壮观、难以完整复原，均不构成超自然证据。")]},{id:"experiments",title:"所谓「抓鬼实验」",blocks:[it("此类通俗称呼在正式文件中写作「现场异常体验调查」或按实际测量对象命名。实验须预先确定要观察的现象、对照条件、仪器限制和判定标准，避免在采集后任意寻找符合预期的片段。"),it("声学记录应同步检查设备噪声、无线干扰和外部声源；影像记录应保留原文件与光照条件；访谈应避免诱导性提问。参与者的期待、疲劳与相互影响属于应记录的变量，不应作为嘲讽其经历的理由。"),it("不得为获得反应而进行危险挑衅、破坏文化物件、诱导恐慌或剥夺睡眠。没有观测到预定现象，是可以成立的结果。")]},{id:"admission",title:"受理标准",blocks:[Je(["条件","受理判断"],[["存在可定位的信息","有可核对的来源、时间、地点或实物，不要求最初报告完美。"],["存在明确的研究问题","能够说明待解释的具体差异，而非仅有「感觉神秘」。"],["调查可以增加认识","有材料可复核、有条件补采，或有必要保存即将消失的证据。"],["工作成本与影响合理","不为微弱线索制造大规模社会干扰；优先采取低成本的初步核查。"]])]},{id:"outside",title:"不属于本所的事项",blocks:[it("纯粹的宗教教义争论、没有可研究信息的流言、普通治安案件和已经清楚解释的常规事故，不因带有神秘叙述而自动由 IMS 接管。发现违法行为、医疗需求或普通工程危险时，应及时转交有职责的机构。"),it("转交或不予立项不等于否认报告者的经历。必要时保留脱敏线索索引，说明决定依据与可以重新受理的条件。")]}]},{id:"classification",number:"07",title:"项目分类与编号",english:"CLASSIFICATION & IDENTIFIERS",group:"研究与设施",description:"编号回答「是哪一项」，类型回答「研究什么」，等级回答「如何安全地工作」。",sections:[{id:"numbering",title:"统一编号格式",blocks:[it("正式项目使用 CC-T-NNNN 格式：来源国家或地区代码、主要研究类型、登记序号。字母大写，字段间使用短横线。序号在同一代码与类型组合内从 0001 起递增，至少四位；超过 9999 后自然增加位数，不循环使用。"),ji("identifier"),it("CC 原则上使用 ISO 3166-1 两字母代码，例如 CN、CL、EG、GB。ZZ 是 IMS 在用户自定义范围内保留的跨区域或来源暂无法确定标记，不代表一个国家。登记中的地区名称仅服务于材料定位，不表达主权立场。")]},{id:"types",title:"四种主要类型",blocks:[Je(["代码","类型","判定依据"],[["H","历史 / History","问题主要依赖文献、口述史或历史叙述之间的差异。"],["S","地点 / Site","研究现象主要与特定位置、建筑或环境相联系。"],["O","物品 / Object","研究以可移动的物品或材料本身为核心。"],["P","现象 / Phenomenon","重复事件、体验或过程，不主要依附单一地点或物品。"]]),it("每个项目仅选一个主要类型，其他特征作为标签记录。研究包含人员时，应按研究现象分类，不把人员登记为可处置的「物品」。类型用于工作分流，不代表危险程度。")]},{id:"stability",title:"编号的稳定性",blocks:[sn(["移动不改号","物品跨国转移、责任研究站变更或长期保管地点调整，均不改变已发出的编号。来源字段与当前所在位置分别记录。"],["纠错可追溯","初始类型或来源判断有误时，原则上保留编号并修正元数据。确须更号，由登记部门维护永久对应关系，旧号不得分配给其他项目。"],["拆分与合并留关联","独立问题需要拆分时另发编号并关联原记录；合并后保留被合并编号的检索入口。结案号码永久保留。"],["设施不写进项目号","总部、研究站和联络处使用独立设施代码。HQ 表示总部，其余由登记部门分配 ST-序号；项目记录另填责任设施。"])]},{id:"risk",title:"四级行动风险",blocks:[ji("risk"),it("风险按当前可接触条件下的现实后果与暴露可能性评估，不按传说的恐怖程度、研究难度或未知程度评估。资料不足时增加保护余量并注明不确定性，而不是直接指定最高级。风险等级与人员访问级别相互独立。")]},{id:"evidence-status",title:"证据与工作状态",blocks:[Je(["字段","允许值","含义"],[["证据状态","未核实 / 待复核 / 已确认 / 已解释","区分线索、初步差异、经独立复核的现象与已有充分解释的现象。已确认不等于确认某种超自然成因。"],["工作状态","受理 / 调查 / 监测 / 保管 / 结案","表明当前主要管理方式。监测与保管可同时存在，以主要职责为主状态，另行备注。"],["风险等级","R0 / R1 / R2 / R3","说明当前行动所需的安全措施，可以随证据和条件变化。"],["访问级别","L1 / L2 / L3","说明材料的访问要求，不表示研究价值或危害强度。"]])]}]},{id:"procedure",number:"08",title:"研究与处置流程",english:"RESEARCH & RESPONSE",group:"研究与设施",description:"让每一个结论有来源，让每一次介入有理由，也让每一项工作有结束的方式。",sections:[{id:"cycle",title:"标准工作循环",blocks:[ji("workflow"),it("流程用于保证关键检查不被跳过，不要求所有项目走向封闭、保管或干预。没有安全问题的文献研究，可以在独立复核后直接结案；长期观测也不意味着永远无法得到有效结论。")]},{id:"intake",title:"受理与初核",blocks:[it("记录报告原文、来源渠道、时间与可回访方式。先排除误传、重复提交和已知事件，再判断是否存在可核对的问题。线索登记不等于正式项目登记，避免以项目数量代替研究质量。"),it("初核应尽量利用公开资料、合法取得的记录与自愿补充信息。存在即时危险时先保护人员，并把安全响应与科学判断分开记录；无须等到确认超自然成因才处理普通火灾、结构风险或有害环境。")]},{id:"design",title:"调查与实验",blocks:[sn(["明确问题","在开始前写清观测目标、假说、替代解释、预定判定标准与停止条件。探索性观察可以开展，但不得事后伪称为预先验证。"],["建立基线","记录设备校准、环境条件、人员构成与对照区域。适用时采用盲法、重复测量及独立设备交叉核对。"],["保护材料","使用可追踪的采集、封存与移交流程；保留原始版本，不用经过增强的影像代替原文件。"],["管理变更","现场偏离方案时记录原因、影响和批准人。出现超出预期的风险应先暂停，而不是为了完成实验继续。"])]},{id:"review",title:"独立复核",blocks:[it("复核者应检查数据完整性、方法适配性、普通解释是否充分，以及结论是否超出证据。对无法重做的历史事件，可复核的是来源和推理链，不得宣称已经重复验证事件本身。"),it("研究结论与行动建议分别签署。现象确实发生，不自动支持任何特定机制；研究尚未解释，也不自动支持继续管制。重要少数意见随正式结论保存。")]},{id:"disposition",title:"处置与结案",blocks:[Je(["决定","适用条件","必须留下的安排"],[["记录并结案","已有充分解释，或可研究条件已尽且没有持续风险。","结论、局限、材料去向与重新受理条件。"],["持续监测","存在明确观测价值或可识别的复发条件。","指标、周期、责任人和停止监测标准。"],["受托保管","原地存放不安全，且转移风险与权利问题已处理。","所有权、保管条件、检查周期与返还条件。"],["有限干预","存在现实伤害风险，且干预优于不干预。","专项授权、最小范围、退出条件与恢复计划。"]]),it("结案不是销毁资料，也不是宣称已理解全部机制。长期任务必须按批准周期复核必要性，不能仅因已有预算或设施而永久延续。")]}]},{id:"headquarters",number:"09",title:"总部与设施",english:"HEADQUARTERS & FACILITIES",group:"研究与设施",description:"森林之下，一座为安静研究而建的机构，而不是一座等待战争的堡垒。",sections:[{id:"site",title:"总部定位",blocks:[it("IMS 总部代号 HQ，位于受保护林区下方的有限地下建筑群。地表维持林地与低干扰维护区的外观，内部容纳总署、核心文献库、跨学科研究空间和必要保障设施。总部坐标、真实通行路线与安保参数不列入通用手册。"),it("总部承担协调与标准维护，不集中保管所有特殊物品。需要特殊隔离、频繁物流或专门环境的研究，由适合的地区设施承担。地下位置用于降低干扰与保护长期研究环境，不意味着建筑具备不受物理条件限制的空间。"),ji("headquarters")]},{id:"entrance",title:"林间石环入口",blocks:[it("主入口位于林间的一处圆形石台。地表可见风化石材与低矮环缘，整体近似废弃祭坛；这是一套专门建造的入口结构，不是对真实古代圣地的占用，也不依靠仪式或超自然力量工作。"),it("获准通行并完成周界检查后，六根覆石立柱从环形基座中缓慢升起，展开与柱体相连的防护界面，形成受保护的入口区。中央圆形盖板沿导轨收回，露出停在地表层的升降平台。通行人员进入后，防护门闭合，平台再下降至地下接待层。"),it("立柱承担导向、防护与视觉遮蔽功能，不负责支撑整个地下建筑。石材包覆下为常规机械与结构系统。平台下降后地表盖板复位，立柱在确认周界无人后回落；结构不会带着未清空的地表一起移动。")]},{id:"layers",title:"地下功能分层",blocks:[Je(["区域","主要功能","通行原则"],[["B1 / 接待与联络","到达检查、短时等候、会议与区域联络。","访客在登记与陪同下活动，不直接进入研究区。"],["B2 / 研究与文献","常规实验、比对工作室、文献阅览与数据处理。","按任务范围授权，资料与样本流线分别管理。"],["B3 / 受限保管","适合总部条件的物品保管、特定材料观察与设施控制。","按需开放，不因持有 L3 级别而自动准入全部区域。"],["保障区 / 独立分区","供电、通风、水处理、医疗支持与设备维护。","与公共工作区防火分隔，保障人员按岗位通行。"]])]},{id:"resilience",title:"日常运行与安全",blocks:[sn(["独立后勤通道","物资、大型设备与日常维护使用受控服务通道，不通过林间石环搬运。人员高峰可由经批准的常规通道分流。"],["独立疏散路线","各工作分区设独立的疏散与避险路径。石环入口不是唯一出口，也不被计算为所有人员的共同逃生通道。"],["环境与能源","地下区域采用常规分区通风、排水、防潮和消防系统，设冗余电源。热量、空气与物资交换均按真实工程条件设计。"],["机械失效保护","升降平台、盖板与立柱设置联锁，禁止相互冲突的动作。失电时进入制动和保护状态，人员按现场指示转移，不启动所谓仪式复位。"],["地表维护","林地由受托维护单位管理，定期检查排水、植被、地表沉降与施工影响。隐蔽不能以破坏生态或制造危险为代价。"])]},{id:"network",title:"全球设施网络",blocks:[it("研究站按专业能力与地理条件设置，规模可以从数间联合工作室到独立研究园区。联络处以沟通、文献与协调为主，不默认配有保管区或安保力量。现场临时设施在任务结束后撤除或移交。"),it("关键资料在相互独立的受控地点保留副本。总部暂时不可使用时，由既定代理机构接续协调职能，不以总部正常运行作为整个机构持续存在的唯一条件。")]}]},{id:"terminology",number:"10",title:"术语与文书规范",english:"TERMINOLOGY & WRITING",group:"文档参考",description:"准确的措辞，是防止猜测逐渐变成「事实」的第一道措施。",sections:[{id:"glossary",title:"通用术语",blocks:[ji("glossary")]},{id:"language",title:"表述规则",blocks:[Je(["避免使用","建议写法","原因"],[["「已证实是鬼魂」","「记录到尚未解释的声学事件；来源待复核。」","把观测与成因判断分开。"],["「仪器被某种力量破坏」","「设备在该时刻停止记录；故障原因未定。」","不将缺失数据本身当作机制证据。"],["「所有人都会受到影响」","「在已记录的条件与样本范围内观察到影响。」","不把有限观察扩张为无条件结论。"],["「对象已完全安全」","「当前规定的接触条件下，未识别出额外风险。」","说明评估条件与适用范围。"]])]},{id:"record",title:"基础记录要素",blocks:[it("通用记录至少包含：文件编号与版本、责任人员或部门、记录时间、资料来源、实际观测、采用方法、解释与替代解释、当前局限、风险判断及后续决定。没有资料的字段标明「未取得」或「不适用」，不得用文学性描述填充。"),it("时间记录注明时区；测量使用明确单位；引用区分原文、译文与研究者注释。图片、声音和影像附采集条件及处理说明。图示不是建筑施工图，示意尺度不能当作真实距离。")]},{id:"naming",title:"命名与语气",blocks:[it("文件以准确、中性和可检索为目标。内部简称应附正式名称，不使用带有恐吓、神化或侮辱性质的称呼。地方已有名称时予以保留，并在需要时记录不同语言版本。"),it("记录人员不使用全知视角描述未知动机，不把巧合写成命运，也不将研究人员描写为无需证据的权威。对不确定事项明确使用「未核实」「在当前条件下」或「尚不能区分」。")]}]},{id:"revisions",number:"11",title:"修订与文档控制",english:"REVISION & DOCUMENT CONTROL",group:"文档参考",description:"基础文件应当稳定，但不应当拒绝纠错。每一次变化都需要留下依据。",sections:[{id:"current",title:"当前生效版本",blocks:[Je(["项目","登记内容"],[["手册名称","IMS 机构基础手册 / Institutional Handbook"],["手册编号","IMS-GD / 001-011"],["版本与日期","1.0 / 2026.04.01"],["维护部门","文献与登记部"],["批准机构","总署；涉及权限与伦理的部分经监督委员会复核"],["分发范围","L1 内部；正式人员及经批准的协作人员"]])]},{id:"history",title:"修订记录",blocks:[Je(["版本","生效日期","修订内容"],[["1.0","2026.04.01","首次统一发布。确立研究优先的机构定位、三级访问体系、四级风险体系、统一编号及总部通用设施说明。"]]),it("本版无被替代的正式版本。后续修订须注明受影响章节、变更性质、批准依据与生效日期，不将未经批准的工作稿列为既有制度。")]},{id:"changes",title:"修订程序",blocks:[sn(["提出","由任一正式人员经所属单位提交具体条文、发现的问题及建议依据。涉及安全的问题可以直接提交监督委员会。"],["复核","文献与登记部检查术语和交叉引用；相关职能部门评估实际影响。涉及权利、强制措施或伦理时，必须独立审查。"],["批准与发布","总署批准通用规范修订。超出协约既有授权的内容须提交协约理事会，不得以修改手册的方式自行扩权。"],["替代与留存","新版本标记生效时间，旧版本保留并清楚标记已替代。既有任务按专门过渡安排执行，紧急安全修订除外。"])]},{id:"copies",title:"离线副本与引用",blocks:[it("离线副本包含本版全部基础章节。副本保留版本与分发标记，但不自动获得未来更新。用于正式工作前，应向文献与登记部核对有效版本。"),it("引用时使用「手册编号 / 章节标题 / 版本」。个人收藏、阅读位置和页面显示偏好仅用于阅览，不构成机构对人员身份、访问资格或任务授权的认证。"),va("文件效力","本手册说明通用制度，不是一份现场处置令。对具体事件行使优先权，仍须取得符合条件的专项授权。")]}]}],jo=[{code:"R0",title:"常规",english:"ROUTINE",color:"neutral",summary:"未识别出超出普通环境的额外危险。",action:"采用常规研究与职业安全措施；无需因项目身份额外封控。",review:"出现新信息或接触条件变化时重新评估。"},{code:"R1",title:"注意",english:"CAUTION",color:"mint",summary:"影响轻微、短时，或可通过简单条件避免。",action:"限定接触方式，执行双人核对或基础防护，清楚告知相关人员。",review:"调查负责人在每轮工作前核对条件。"},{code:"R2",title:"限制",english:"RESTRICTED",color:"amber",summary:"可能造成明显伤害，但作用范围与触发条件可界定。",action:"设置受控区域、专项操作方案和停止条件，禁止未经培训的接触。",review:"研究与安全负责人共同批准；条件改变即暂停复核。"},{code:"R3",title:"紧急",english:"URGENT",color:"coral",summary:"已经或即将造成严重人身伤害，影响仍限于具体场所或局地。",action:"优先疏散与隔离，启动事件指挥；需要行政优先权时另行取得授权。",review:"持续评估并尽快降级；不以最高风险标记代替处置令。"}],Ci=[{title:"接收线索",english:"RECEIVE",description:"保留原始报告，核对来源与基本信息，区分即时安全问题和需要进一步研究的问题。",output:"输出：线索记录与初步安全判断"},{title:"初步核查",english:"VERIFY",description:"核对既有解释、相关资料和可调查条件。证据不足时请求补充，而不是直接认定异常。",output:"输出：受理、转交或暂不立项决定"},{title:"调查研究",englis
