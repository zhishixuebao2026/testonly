<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邦多利角色点评 · 上半部分</title>
<style>
  :root { --ink:#fff; --bg:#0d0f1e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#050610; color:var(--ink); font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { width:1080px; height:1920px; position:relative; overflow:hidden; background:var(--bg); transform-origin:center center; flex:none; }
  .scene { position:absolute; inset:0; opacity:0; transition:opacity .6s ease; pointer-events:none; }
  .scene.on { opacity:1; }
  .bgfx { position:absolute; inset:0; }
  canvas#fx { position:absolute; inset:0; width:1080px; height:1920px; }
  .sub-box { position:absolute; left:70px; right:70px; bottom:250px; min-height:260px; background:rgba(8,9,22,.62); border-radius:28px; padding:34px 40px; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.08); }
  .sub { font-size:50px; line-height:1.55; font-weight:600; letter-spacing:.02em; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .sub .c { opacity:0; transition:opacity .08s linear; }
  .sub .c.on { opacity:1; }
  .tag { position:absolute; top:150px; left:70px; font-size:30px; letter-spacing:.3em; opacity:.85; font-weight:700; }
  .ctrl { position:fixed; left:0; right:0; bottom:0; height:56px; display:flex; gap:14px; align-items:center; justify-content:center; background:#0b0c1ccc; font-size:15px; z-index:5; }
  .ctrl button { background:#fff; color:#111; border:0; border-radius:6px; padding:6px 16px; font-size:15px; cursor:pointer; }
  .bar { position:absolute; left:0; bottom:0; height:6px; background:#ff7ab8; width:0; }
  #hint { position:fixed; top:8px; left:0; right:0; text-align:center; font-size:13px; color:#aab; z-index:5; }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <!-- 场景 1 ksm 声音 -->
  <section class="scene" data-i="0"><canvas class="fx" data-fx="rings"></canvas><div class="tag">01 · KASUMI</div></section>
  <!-- 场景 2 前へススメ! -->
  <section class="scene" data-i="1"><div class="bgfx" data-fx="song"></div><div class="tag">02 · 前へススメ!</div></section>
  <!-- 场景 3 ksm 距离 -->
  <section class="scene" data-i="2"><div class="bgfx" data-fx="seats"></div><div class="tag">03 · 距离</div></section>
  <!-- 场景 4 ars 傲娇永动机 -->
  <section class="scene" data-i="3"><div class="bgfx" data-fx="loop"></div><div class="tag">04 · 永动机</div></section>
  <!-- 场景 5 otae 电波 -->
  <section class="scene" data-i="4"><div class="bgfx" data-fx="denpa"></div><div class="tag">05 · 电波克傲娇</div></section>
  <!-- 场景 6 摩卡 -->
  <section class="scene" data-i="5"><div class="bgfx" data-fx="moca"></div><div class="tag">06 · 摩卡</div></section>
  <!-- 场景 7 兰 -->
  <section class="scene" data-i="6"><div class="bgfx" data-fx="ran"></div><div class="tag">07 · 兰</div></section>
  <!-- 场景 8 萝团 -->
  <section class="scene" data-i="7"><div class="bgfx" data-fx="roselia"></div><div class="tag">08 · 萝团</div></section>
  <!-- 场景 9 Pastel*Palettes -->
  <section class="scene" data-i="8"><div class="bgfx" data-fx="pastel"></div><div class="tag">09 · PASTEL*PALETTES</div></section>
  <!-- 场景 10 伊芙 千圣 结尾 -->
  <section class="scene" data-i="9"><div class="bgfx" data-fx="echo"></div><div class="tag">10 · 下期见</div></section>

  <div class="sub-box"><div class="sub" id="sub"></div></div>
  <div class="bar" id="bar"></div>
</div>
</div>
<div id="hint">点击 ▶ 开始（需要点击一次才能播放声音）</div>
<div class="ctrl">
  <button id="play">▶ 播放</button>
  <button id="restart">从头</button>
  <span id="status">未开始</span>
  <button id="bgmToggle">BGM 开/关</button>
</div>
<audio id="bgm" src="assets/bgm/ambient_placeholder.mp3" loop preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
